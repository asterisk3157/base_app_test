<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Board</title>
    <style>
        /* Kawaii / Cute Pastel Color Palette */
        :root {
            --bg-color: #FFF0F5;
            --text-color: #5C4d4d;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 182, 193, 0.4);
            --accent: #FFB6C1;
            --accent-hover: #FFC0CB;
            --secondary-text: #9d8b8b;
            --cute-shadow: 0 8px 24px rgba(255, 182, 193, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Hiragino Maru Gothic ProN", "Kosugi Maru", "Varela Round", "Meiryo", sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 240, 245, 0.8) 0%, transparent 50%);
            color: var(--text-color);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
            /* Prevent horizontal scroll from floating petals */
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -0.015em;
            text-align: center;
            margin-bottom: 40px;
            color: var(--text-color);
        }

        /* Glassmorphism Form Area */
        .post-form-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--card-border);
            border-radius: 30px;
            /* Much rounder */
            padding: 30px;
            box-shadow: var(--cute-shadow);
            margin-bottom: 40px;
            transition: box-shadow 0.3s ease;
        }

        .post-form-card:focus-within {
            box-shadow: 0 12px 32px rgba(255, 182, 193, 0.35);
            transform: translateY(-2px);
        }

        input[type="text"],
        textarea {
            width: 100%;
            background: transparent;
            border: none;
            font-family: inherit;
            color: var(--text-color);
            outline: none;
            margin-bottom: 16px;
        }

        input[type="text"] {
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-bottom: 1px solid var(--accent);
        }

        textarea {
            height: 100px;
            resize: none;
            font-size: 18px;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: var(--secondary-text);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
        }

        button {
            background-color: var(--accent);
            color: #5C4d4d;
            border: none;
            padding: 12px 28px;
            border-radius: 980px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.4);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 182, 193, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Posts List Area */
        #posts {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .post {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 24px;
            padding: 20px 24px;
            box-shadow: var(--cute-shadow);
            font-size: 17px;
            word-wrap: break-word;
        }

        .reply-post {
            margin-left: 28px;
            border-left: 3px dashed var(--accent);
            background: rgba(255, 228, 235, 0.25);
            border-radius: 0 20px 20px 0;
            padding: 14px 18px;
            margin-top: 10px;
            margin-bottom: 4px;
            box-shadow: none;
            border-top: none;
            border-right: none;
            border-bottom: none;
            position: relative;
        }

        .reply-to-label {
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 4px;
            opacity: 0.85;
        }

        .replies-group {
            margin-top: 8px;
            padding-left: 0;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .post-author {
            font-weight: 600;
            font-size: 14px;
            color: var(--secondary-text);
        }

        .post-date {
            font-size: 12px;
            color: var(--secondary-text);
            opacity: 0.8;
        }

        .post-actions {
            display: flex;
            gap: 16px;
            margin-top: 14px;
            border-top: 1px solid var(--card-border);
            padding-top: 12px;
        }

        .action-button {
            background: transparent;
            color: var(--secondary-text);
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 4px 8px;
            border-radius: 12px;
            box-shadow: none;
            /* Override base button shadow */
        }

        .action-button:hover {
            color: var(--accent);
            background: rgba(255, 182, 193, 0.15);
            transform: scale(1.1);
            box-shadow: none;
        }

        .action-button.like:hover:not(:disabled) {
            color: #ff6b81;
        }

        .action-button.reply:hover,
        .action-button.edit:hover {
            color: var(--accent);
        }

        .action-button.delete:hover {
            color: #ff6b81;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
                margin-bottom: 30px;
            }

            .post-form-card,
            .modal-content {
                padding: 20px;
            }

            textarea {
                font-size: 16px;
            }

            .post {
                padding: 16px 20px;
                font-size: 16px;
            }

            .reply-post {
                margin-left: 20px;
            }
        }

        /* 🌸 Sakura Petal Animation (March-April seasonal) */
        .sakura-petal {
            position: fixed;
            top: -40px;
            z-index: 9999;
            pointer-events: none;
            font-size: 20px;
            opacity: 0.85;
            animation: sakura-fall linear forwards;
        }

        @keyframes sakura-fall {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(1);
                opacity: 0.9;
            }

            25% {
                transform: translateY(25vh) translateX(30px) rotate(90deg) scale(0.95);
                opacity: 0.85;
            }

            50% {
                transform: translateY(50vh) translateX(-20px) rotate(180deg) scale(0.9);
                opacity: 0.75;
            }

            75% {
                transform: translateY(75vh) translateX(40px) rotate(270deg) scale(0.85);
                opacity: 0.5;
            }

            100% {
                transform: translateY(110vh) translateX(-10px) rotate(360deg) scale(0.8);
                opacity: 0;
            }
        }

        /* Custom Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 240, 245, 0.7);
            /* Pinkish transparent overlay instead of stark black */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--card-border);
            border-radius: 30px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: var(--cute-shadow);
            transform: scale(0.85) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal-content input[type="password"],
        .modal-content textarea {
            background: rgba(255, 245, 248, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px;
            color: var(--text-color);
            margin-bottom: 16px;
            width: 100%;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .modal-content input[type="password"]:focus,
        .modal-content textarea:focus {
            border-color: var(--accent);
        }

        .modal-content textarea {
            height: 120px;
            resize: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .modal-actions .btn-cancel {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--card-border);
        }

        .modal-actions .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>ひとこと掲示板</h1>

        <div class="post-form-card">
            <form id="postForm">
                <input type="text" name="author" id="author" placeholder="なまえ（省略すると「名無し」になります）">
                <textarea name="content" id="content" placeholder="今なにしてる？" required></textarea>
                <input type="text" name="delete_password" id="delete_password" placeholder="編集用パスワード（任意）">
                <input type="hidden" name="weather" id="weatherInput">
                <div class="form-actions">
                    <span id="currentWeatherDisplay"
                        style="color: #86868b; font-size: 14px; margin-right: auto; align-self: center;">天気情報を取得中...</span>
                    <button type="submit">投稿する</button>
                </div>
            </form>
        </div>

        <div id="posts">
            <!-- Posts will be loaded here via JS -->
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">投稿を編集</div>
            <input type="password" id="editPassword" placeholder="現在の編集用パスワード（必須）">
            <textarea id="editContentText" placeholder="新しい内容を入力してください"></textarea>
            <input type="text" id="editNewPassword" placeholder="新しいパスワード（変更する場合のみ入力）">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">キャンセル</button>
                <button onclick="submitEdit()">保存</button>
            </div>
        </div>
    </div>

    <!-- Reply Modal -->
    <div id="replyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">返信する</div>
            <input type="text" id="replyAuthor" placeholder="なまえ（省略すると「名無し」になります）">
            <textarea id="replyContentText" placeholder="返信内容を入力してください"></textarea>
            <input type="text" id="replyDeletePassword" placeholder="編集用パスワード（任意）">
            <span id="currentReplyWeatherDisplay"
                style="color: #9d8b8b; font-size: 13px; display: block; margin-bottom: 10px;">天気情報を取得中...</span>
            <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 12px; flex-wrap: nowrap;">
                <button class="btn-cancel" onclick="closeReplyModal()">キャンセル</button>
                <button onclick="submitReply()">返信する</button>
            </div>
        </div>
    </div>

    <script>
        let currentEditPostId = null;

        function openEditModal(postId, currentContent) {
            currentEditPostId = postId;
            document.getElementById('editContentText').value = currentContent;

            // Security feedback: Do not auto-fill passwords so the user explicitly types it
            document.getElementById('editPassword').value = '';

            document.getElementById('editNewPassword').value = '';
            document.getElementById('editModal').classList.add('active');

            document.getElementById('editPassword').focus();
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            currentEditPostId = null;
        }

        function submitEdit() {
            if (!currentEditPostId) return;
            const secret = document.getElementById('editPassword').value;
            const newContent = document.getElementById('editContentText').value;
            const newPassword = document.getElementById('editNewPassword').value;

            if (secret && newContent && newContent.trim() !== "") {
                const formData = new FormData();
                formData.append('secret', secret);
                formData.append('content', newContent);
                if (newPassword && newPassword.trim() !== "") {
                    formData.append('new_password', newPassword);
                }
                fetch(`/api/posts/${currentEditPostId}/edit`, {
                    method: 'POST',
                    body: formData
                })
                    .then(response => {
                        if (response.ok) {
                            if (newPassword && newPassword.trim() !== "") {
                                // Update saved password if they changed it successfully
                                localStorage.setItem('lastPostPassword', newPassword);
                            }
                            closeEditModal();
                            loadPosts();
                        } else {
                            alert('権限がありません（パスワードが違います）。');
                        }
                    });
            } else {
                alert('パスワードと新しい内容を入力してください。');
            }
        }

        // Reply logic
        let currentReplyParentId = null;

        function openReplyModal(postId) {
            currentReplyParentId = postId;
            document.getElementById('replyAuthor').value = '';
            document.getElementById('replyContentText').value = '';
            document.getElementById('replyDeletePassword').value = '';
            document.getElementById('replyModal').classList.add('active');
            document.getElementById('replyContentText').focus();
        }

        function closeReplyModal() {
            document.getElementById('replyModal').classList.remove('active');
            currentReplyParentId = null;
        }

        function submitReply() {
            if (!currentReplyParentId) return;
            const author = document.getElementById('replyAuthor').value;
            const content = document.getElementById('replyContentText').value;
            const deletePassword = document.getElementById('replyDeletePassword').value;

            if (content && content.trim() !== "") {
                const formData = new FormData();
                formData.append('parent_id', currentReplyParentId);
                formData.append('author', author);
                formData.append('content', content);
                formData.append('delete_password', deletePassword);

                // Include weather string the same way as main posts
                const weatherStr = document.getElementById('weatherInput') ? document.getElementById('weatherInput').value : '';
                formData.append('weather', weatherStr);

                fetch(`/post`, {
                    method: 'POST',
                    body: formData
                })
                    .then(response => {
                        closeReplyModal();
                        loadPosts();
                    });
            } else {
                alert('返信内容を入力してください。');
            }
        }

        function renderPost(post, containerDiv, isReply = false, parentAuthor = '') {
            const div = document.createElement('div');
            div.className = 'post';
            if (isReply) {
                div.classList.add('reply-post');
            }

            // Show "replying to" label for replies
            if (isReply && parentAuthor) {
                const replyLabel = document.createElement('div');
                replyLabel.className = 'reply-to-label';
                replyLabel.innerText = `↩️ ${parentAuthor || '名無し'} への返信`;
                div.appendChild(replyLabel);
            }

            const headerDiv = document.createElement('div');
            headerDiv.className = 'post-header';

            const authorDiv = document.createElement('div');
            authorDiv.className = 'post-author';
            authorDiv.innerText = post.author || '名無し';

            const dateDiv = document.createElement('div');
            dateDiv.className = 'post-date';
            const wStr = post.weather ? `  ${post.weather}` : '';
            dateDiv.innerText = `${post.created_at ? post.created_at.substring(0, 16) : ''}${wStr}`;

            headerDiv.appendChild(authorDiv);
            headerDiv.appendChild(dateDiv);

            const contentDiv = document.createElement('div');
            contentDiv.innerHTML = post.content;

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'post-actions';

            const replyBtn = document.createElement('button');
            replyBtn.className = 'action-button reply';
            replyBtn.innerHTML = `💬 返信`;
            replyBtn.onclick = () => {
                openReplyModal(post.id);
            };

            const likeBtn = document.createElement('button');
            likeBtn.className = 'action-button like';

            const likedPosts = JSON.parse(localStorage.getItem('likedPosts') || '[]');
            const isLiked = likedPosts.includes(post.id);

            likeBtn.innerHTML = isLiked ? `❤️ ${post.likes || 0}` : `🤍 ${post.likes || 0}`;

            if (isLiked) {
                likeBtn.style.color = '#ff3b30';
                likeBtn.style.cursor = 'default';
                likeBtn.title = 'いいね済みです';
            } else {
                likeBtn.onclick = () => {
                    fetch(`/api/posts/${post.id}/like`, { method: 'POST' })
                        .then(() => {
                            likedPosts.push(post.id);
                            localStorage.setItem('likedPosts', JSON.stringify(likedPosts));
                            loadPosts();
                        });
                };
            }

            const editBtn = document.createElement('button');
            editBtn.className = 'action-button edit';
            editBtn.innerHTML = `✏️ 編集`;
            editBtn.onclick = () => {
                openEditModal(post.id, post.content);
            };

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'action-button delete';
            deleteBtn.innerHTML = `🗑️ 削除`;
            deleteBtn.onclick = () => {
                const secret = prompt('削除するには管理者パスワード、または投稿時に設定した「編集用パスワード」を入力してください:');
                if (secret) {
                    const formData = new FormData();
                    formData.append('secret', secret);
                    fetch(`/api/posts/${post.id}/delete`, {
                        method: 'POST',
                        body: formData
                    })
                        .then(response => {
                            if (response.ok) {
                                loadPosts();
                            } else {
                                alert('権限がありません（パスワード、またはなまえが違います）。');
                            }
                        });
                }
            };

            actionsDiv.appendChild(replyBtn);
            actionsDiv.appendChild(likeBtn);
            actionsDiv.appendChild(editBtn);
            actionsDiv.appendChild(deleteBtn);

            div.appendChild(headerDiv);
            div.appendChild(contentDiv);
            div.appendChild(actionsDiv);

            // Render nested replies INSIDE this post's div
            if (post.replies && post.replies.length > 0) {
                const repliesContainer = document.createElement('div');
                repliesContainer.className = 'replies-group';
                post.replies.forEach(reply => {
                    renderPost(reply, repliesContainer, true, post.author);
                });
                div.appendChild(repliesContainer);
            }

            containerDiv.appendChild(div);
        }

        function loadPosts() {
            fetch('/api/posts')
                .then(response => response.json())
                .then(data => {
                    const postsDiv = document.getElementById('posts');
                    postsDiv.innerHTML = '';
                    data.posts.forEach((post) => {
                        renderPost(post, postsDiv);
                    });
                });
        }

        // Weather API Integration
        function parseWeatherCode(code) {
            if (code === 0) return '☀️ 晴れ';
            if (code >= 1 && code <= 3) return '⛅️ 曇り';
            if (code >= 51 && code <= 67) return '☔️ 雨';
            if (code >= 71 && code <= 77) return '❄️ 雪';
            if (code >= 80 && code <= 82) return '🌧️ 強い雨';
            if (code >= 95) return '⚡️ 雷雨';
            return '☁️ 曇り'; // Default fallback
        }

        async function fetchWeather() {
            try {
                let lat = 40.7128; // New York Default
                let lon = -74.0060;
                let regionName = 'ニューヨーク'; // Default fallback region

                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 3000 });
                    });
                    lat = pos.coords.latitude;
                    lon = pos.coords.longitude;

                    // Simple Region logic based on Japanese latitudes/longitudes
                    if (lat >= 41.2) {
                        regionName = '北海道';
                    } else if (lat >= 36.8 && lat < 41.2) {
                        regionName = '東北';
                    } else if (lat >= 34.8 && lat < 36.8 && lon >= 138.0) {
                        regionName = '関東';
                    } else if (lat >= 36.0 && lat < 38.0 && lon < 139.0) {
                        regionName = '北陸';
                    } else if (lat >= 34.0 && lat < 36.8 && lon >= 136.0 && lon < 138.0) {
                        regionName = '中部';
                    } else if (lat >= 33.0 && lat < 35.8 && lon >= 134.0 && lon < 136.0) {
                        regionName = '近畿';
                    } else if (lat >= 33.0 && lat < 35.5 && lon >= 131.0 && lon < 134.0) {
                        regionName = '中国';
                    } else if (lat >= 32.5 && lat < 34.5 && lon >= 132.0 && lon < 135.0) {
                        regionName = '四国';
                    } else if (lat >= 30.0 && lat < 34.0 && lon >= 128.0 && lon < 132.0) {
                        regionName = '九州';
                    } else if (lat < 30.0) {
                        regionName = '沖縄';
                    }
                } catch (e) {
                    console.log('Geolocation unavailable, defaulting to New York weather');
                }

                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await res.json();
                const weatherStr = parseWeatherCode(data.current_weather.weathercode);
                const fullWeatherStr = `${regionName} ${weatherStr}`;

                if (document.getElementById('currentWeatherDisplay')) {
                    document.getElementById('currentWeatherDisplay').innerText = `現在地: ${fullWeatherStr}`;
                    document.getElementById('weatherInput').value = fullWeatherStr;
                }
                if (document.getElementById('currentReplyWeatherDisplay')) {
                    document.getElementById('currentReplyWeatherDisplay').innerText = `現在地: ${fullWeatherStr}`;
                }
            } catch (err) {
                if (document.getElementById('currentWeatherDisplay')) {
                    document.getElementById('currentWeatherDisplay').innerText = '';
                }
                if (document.getElementById('currentReplyWeatherDisplay')) {
                    document.getElementById('currentReplyWeatherDisplay').innerText = '';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', fetchWeather);

        document.getElementById('postForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const formData = new FormData(this);

            // Remember the password they used locally
            const postPass = formData.get('delete_password');
            if (postPass) {
                localStorage.setItem('lastPostPassword', postPass);
            }

            fetch('/post', {
                method: 'POST',
                body: formData
            }).then(() => {
                document.getElementById('content').value = '';
                loadPosts(); // Reload to show the new post
            });
        });

        // Add Ctrl+Enter or Cmd+Enter shortcut for edit submission
        document.getElementById('editContentText').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault(); // Prevent default newline
                submitEdit();
            }
        });

        // Add Ctrl+Enter or Cmd+Enter shortcut for submission
        document.getElementById('content').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault(); // Prevent default newline
                // Dispatch submit event on the form
                document.getElementById('postForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
            }
        });

        // Load posts initially and every 2 seconds
        loadPosts();
        setInterval(loadPosts, 2000);

        // 🌸 Sakura Petal Animation (March ~ April)
        (function initSakura() {
            const month = new Date().getMonth(); // 0-indexed: 2=March, 3=April
            if (month !== 2 && month !== 3) return; // Only March and April

            const petalChars = ['🌸', '🌸', '🌸', '✿', '❀', '💮'];
            const maxPetals = 25; // Number of petals on screen at once
            let activePetals = 0;

            function spawnPetal() {
                if (activePetals >= maxPetals) return;

                const petal = document.createElement('div');
                petal.className = 'sakura-petal';
                petal.innerText = petalChars[Math.floor(Math.random() * petalChars.length)];

                // Random horizontal position
                petal.style.left = Math.random() * 100 + 'vw';

                // Random size
                const size = 16 + Math.random() * 18;
                petal.style.fontSize = size + 'px';

                // Random fall duration (6-14 seconds)
                const duration = 6 + Math.random() * 8;
                petal.style.animationDuration = duration + 's';

                // Random delay so they don't all start at once
                const delay = Math.random() * 3;
                petal.style.animationDelay = delay + 's';

                document.body.appendChild(petal);
                activePetals++;

                // Remove petal after animation completes
                setTimeout(() => {
                    petal.remove();
                    activePetals--;
                }, (duration + delay) * 1000);
            }

            // Spawn petals continuously
            setInterval(spawnPetal, 600);

            // Initial burst of petals
            for (let i = 0; i < 10; i++) {
                setTimeout(spawnPetal, i * 200);
            }
        })();
    </script>
