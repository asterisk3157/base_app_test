<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Board - Premium Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5vh;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        form {
            position: relative;
            margin-bottom: 3rem;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 1.5rem;
            box-sizing: border-box;
            border-radius: 16px;
            border: 2px solid transparent;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            font-size: 1.1rem;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        textarea::placeholder {
            color: #9ca3af;
        }

        button {
            position: absolute;
            bottom: -20px;
            right: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #posts {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .post {
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.02);
            font-size: 1.1rem;
            line-height: 1.6;
            animation: slideIn 0.4s ease-out;
            transition: transform 0.2s ease;
        }

        .post:hover {
            transform: scale(1.01);
        }

        /* Essential specifically for XSS demo button embedded safely within aesthetic framework */
        .post button {
            position: static;
            display: inline-block;
            margin-top: 10px;
            background: #ef4444;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .post button:hover {
            background: #dc2626;
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>ひとこと掲示板</h1>
        <form id="postForm">
            <textarea name="content" id="content" placeholder="今なにしてる？" required></textarea>
            <button type="submit">投稿する</button>
        </form>
        
        <div id="posts">
            <!-- Posts will be loaded here via JS -->
        </div>
    </div>

    <script>
        function loadPosts() {
            fetch('/api/posts')
                .then(response => response.json())
                .then(data => {
                    const postsDiv = document.getElementById('posts');
                    postsDiv.innerHTML = '';
                    data.posts.forEach(post => {
                        const div = document.createElement('div');
                        div.className = 'post';
                        // Intentionally using innerHTML to make XSS easier for the lecture
                        div.innerHTML = post.content;
                        postsDiv.appendChild(div);
                    });
                });
        }

        document.getElementById('postForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            fetch('/post', {
                method: 'POST',
                body: formData
            }).then(() => {
                document.getElementById('content').value = '';
                loadPosts();
            });
        });

        // Load posts initially and every 2 seconds
        loadPosts();
        setInterval(loadPosts, 2000);
    </script>
</body>

</html>
