<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twiiter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ---------------------------------------------------------- */
        /* Design tokens                                               */
        /* ---------------------------------------------------------- */
        :root {
            --bg-main:       #15202B;
            --bg-card:       #192734;
            --bg-hover:      #1e2f3e;
            --text-primary:  #E7E9EA;
            --text-secondary:#71767B;
            --accent:        #1D9BF0;
            --accent-hover:  #1a8fd1;
            --border:        #2F3336;
            --like-color:    #F91880;
            --like-bg:       rgba(249, 24, 128, 0.1);
        }

        /* ---------------------------------------------------------- */
        /* Light theme overrides                                      */
        /* ---------------------------------------------------------- */
        [data-theme="light"] {
            --bg-main:        #FFFFFF;
            --bg-card:        #F7F9FA;
            --bg-hover:       #EFF3F4;
            --text-primary:   #0F1419;
            --text-secondary: #536471;
            --accent:         #1D9BF0;
            --accent-hover:   #1a8fd1;
            --border:         #EFF3F4;
            --like-color:     #F91880;
            --like-bg:        rgba(249, 24, 128, 0.1);
        }

        /* Timeline header adapts to theme */
        [data-theme="light"] .timeline-header {
            background: rgba(255, 255, 255, 0.85);
        }

        /* ---------------------------------------------------------- */
        /* Reset & base                                                */
        /* ---------------------------------------------------------- */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        a { color: inherit; text-decoration: none; }

        button {
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            border: none;
            outline: none;
        }

        textarea {
            font-family: 'Inter', sans-serif;
            resize: none;
            outline: none;
            border: none;
        }

        /* ---------------------------------------------------------- */
        /* Layout — 3-column CSS grid                                  */
        /* ---------------------------------------------------------- */
        .layout {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            grid-template-areas: "left center right";
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ---------------------------------------------------------- */
        /* Left sidebar                                                */
        /* ---------------------------------------------------------- */
        .sidebar-left {
            grid-area: left;
            position: sticky;
            top: 0;
            height: 100vh;
            padding: 12px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 9999px;
            transition: background 0.2s;
        }

        .logo:hover { background: var(--bg-hover); }

        .logo-icon {
            width: 36px;
            height: 36px;
            fill: var(--accent);
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 9999px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-primary);
            background: transparent;
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
            user-select: none;
        }

        .nav-item:hover { background: var(--bg-hover); }

        .nav-item.active { font-weight: 700; color: var(--text-primary); background: transparent; }

        .nav-icon {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .nav-item.active .nav-icon {
            fill: var(--text-primary);
            stroke: var(--text-primary);
        }

        /* ---------------------------------------------------------- */
        /* Center timeline                                             */
        /* ---------------------------------------------------------- */
        .timeline {
            grid-area: center;
            border-right: 1px solid var(--border);
            min-height: 100vh;
        }

        .timeline-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(21, 32, 43, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
        }

        .timeline-header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        /* Compose box */
        .compose-box {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 2px solid var(--border);
        }

        .avatar-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            flex-shrink: 0;
            user-select: none;
        }

        .compose-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .compose-textarea {
            background: transparent;
            color: var(--text-primary);
            font-size: 1.15rem;
            width: 100%;
            min-height: 72px;
            line-height: 1.5;
            caret-color: var(--accent);
        }

        .compose-textarea::placeholder { color: var(--text-secondary); }

        .compose-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .compose-footer .compose-tools {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .char-counter {
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .char-counter.warn  { color: #fbbf24; }
        .char-counter.limit { color: var(--like-color); }

        .compose-submit {
            padding: 9px 20px;
            background: var(--accent);
            color: #fff;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 700;
            transition: background 0.2s, transform 0.15s, opacity 0.2s;
        }

        .compose-submit:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .compose-submit:active:not(:disabled) { transform: translateY(0); }

        .compose-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Timeline tabs — おすすめ / フォロー中 */
        .timeline-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .timeline-tab {
            flex: 1;
            padding: 14px 0;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            position: relative;
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
        }

        .timeline-tab:hover {
            background: var(--bg-hover);
        }

        .timeline-tab.active {
            color: var(--text-primary);
        }

        .timeline-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 56px;
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* Tweet feed */
        #tweet-feed {
            display: flex;
            flex-direction: column;
        }

        /* Tweet card */
        .tweet-card {
            display: flex;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
            animation: slideIn 0.35s ease-out;
        }

        .tweet-card:hover { background: var(--bg-hover); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .tweet-body { flex: 1; min-width: 0; }

        .tweet-meta {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
            overflow: hidden;
        }

        .tweet-display-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
            min-width: 0;
        }

        .tweet-handle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tweet-time {
            font-size: 0.9rem;
            color: var(--text-secondary);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tweet-time::before { content: "·"; margin-right: 4px; margin-left: 4px; }

        .tweet-more-btn {
            margin-left: auto;
            background: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            padding: 2px 8px;
            border-radius: 9999px;
            transition: background 0.2s, color 0.2s;
            letter-spacing: 2px;
            flex-shrink: 0;
        }

        .tweet-more-btn:hover {
            background: rgba(29, 155, 240, 0.1);
            color: var(--accent);
        }

        .tweet-context-menu {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            z-index: 100;
            overflow: hidden;
            min-width: 160px;
        }

        .tweet-context-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .tweet-context-item:hover { background: var(--bg-hover); }

        .tweet-context-item.delete {
            color: #F4212E;
        }

        .tweet-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-primary);
            word-break: break-word;
            margin-bottom: 10px;
        }

        .tweet-actions {
            display: flex;
            justify-content: space-between;
            max-width: 100%;
            margin-top: 4px;
        }

        .like-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 9999px;
            transition: color 0.2s, background 0.2s;
        }

        .like-btn:hover {
            color: var(--like-color);
            background: var(--like-bg);
        }

        .like-btn.liked {
            color: var(--like-color);
        }

        .like-btn svg { transition: transform 0.2s; }

        .like-btn.liked svg {
            fill: var(--like-color);
            transform: scale(1.15);
        }

        .like-btn:hover svg { transform: scale(1.15); }

        .reply-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 9999px;
            transition: color 0.2s, background 0.2s;
        }

        .reply-btn:hover {
            color: var(--accent);
            background: rgba(29, 155, 240, 0.1);
        }

        .repost-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 9999px;
            transition: color 0.2s, background 0.2s;
        }

        .repost-btn:hover {
            color: #00ba7c;
            background: rgba(0, 186, 124, 0.1);
        }

        .repost-btn svg { transition: transform 0.2s; }
        .repost-btn:hover svg { transform: scale(1.15); }

        .repost-btn.reposted {
            color: #00ba7c;
        }

        .repost-btn.reposted svg {
            fill: none;
            stroke: #00ba7c;
        }

        /* ---------------------------------------------------------- */
        /* Notification badge and panel                                */
        /* ---------------------------------------------------------- */
        .notif-badge {
            background: var(--accent);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 9999px;
            margin-left: auto;
            min-width: 18px;
            text-align: center;
        }

        .notif-view {
            min-height: 50vh;
        }

        .notif-item {
            display: flex;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
            cursor: pointer;
        }

        .notif-item:hover { background: var(--bg-hover); }

        .notif-item.unread {
            background: rgba(29, 155, 240, 0.05);
        }

        .notif-icon {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notif-icon.like-icon { color: var(--like-color); }
        .notif-icon.reply-icon { color: var(--accent); }

        .notif-text {
            flex: 1;
            font-size: 0.9rem;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .notif-text .notif-actor { font-weight: 700; }

        .notif-time {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* "さらに表示" link in trending panel */
        .show-more-link {
            display: block;
            padding: 14px 16px;
            font-size: 0.9rem;
            color: var(--accent);
            cursor: pointer;
            transition: background 0.2s;
        }

        .show-more-link:hover {
            background: var(--bg-hover);
            border-radius: 0 0 16px 16px;
        }

        /* ---------------------------------------------------------- */
        /* Search view                                                */
        /* ---------------------------------------------------------- */
        .search-view { min-height: 50vh; }

        .search-bar {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 9999px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-result-item {
            display: flex;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-result-item:hover { background: var(--bg-hover); }

        .search-result-info { flex: 1; }

        .search-result-name {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .search-result-handle {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .search-result-bio {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.3;
        }

        /* ---------------------------------------------------------- */
        /* Inline reply compose box                                   */
        /* ---------------------------------------------------------- */
        .inline-reply-box {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
            animation: fadeIn 0.2s ease-out;
        }

        .reply-textarea {
            flex: 1;
            background: var(--bg-main);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.9rem;
            min-height: 44px;
            max-height: 120px;
            resize: vertical;
            font-family: 'Inter', sans-serif;
        }

        .reply-textarea:focus {
            border-color: var(--accent);
            outline: none;
        }

        .reply-textarea::placeholder {
            color: var(--text-secondary);
        }

        .reply-submit {
            align-self: flex-end;
            padding: 8px 18px;
            background: var(--accent);
            color: #fff;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: background 0.2s, transform 0.15s;
            white-space: nowrap;
        }

        .reply-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* ---------------------------------------------------------- */
        /* Reply threads                                              */
        /* ---------------------------------------------------------- */
        .tweet-card.has-replies {
            border-bottom: none;
        }

        .tweet-replies {
            border-left: 2px solid var(--border);
            margin-left: 40px;
        }

        /* Nested replies get less indentation */
        .tweet-replies .tweet-replies {
            margin-left: 20px;
        }

        .reply-card {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
            animation: slideIn 0.35s ease-out;
        }

        .reply-card:hover { background: var(--bg-hover); }

        .reply-card .avatar-circle {
            width: 32px;
            height: 32px;
            font-size: 0.8rem;
        }

        .reply-card .tweet-content {
            font-size: 0.9rem;
        }

        .reply-card .tweet-display-name {
            font-size: 0.88rem;
        }

        .reply-card .tweet-handle,
        .reply-card .tweet-time {
            font-size: 0.82rem;
        }

        /* Loading / empty state */
        .feed-placeholder {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Fade-in animation for view transitions */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .timeline > *:not(.timeline-header) {
            animation: fadeIn 0.2s ease-out;
        }

        /* ---------------------------------------------------------- */
        /* Right sidebar                                               */
        /* ---------------------------------------------------------- */
        .sidebar-right {
            grid-area: right;
            position: sticky;
            top: 0;
            height: 100vh;
            padding: 16px;
            overflow-y: auto;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }

        .sidebar-right-inner {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
        }

        .panel-header {
            padding: 14px 16px;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border);
        }

        /* Recommended users list (formerly bot list) */
        .bot-list {
            display: flex;
            flex-direction: column;
        }

        .bot-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            transition: background 0.2s;
        }

        .bot-item:hover { background: var(--bg-hover); }

        .bot-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .bot-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bot-handle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* "フォローする" button in recommended users panel */
        .follow-btn {
            padding: 6px 16px;
            background: var(--text-primary);
            color: var(--bg-main);
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .follow-btn:hover {
            opacity: 0.85;
        }

        /* Trending section */
        .trending-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .trending-item:last-child { border-bottom: none; }

        .trending-item:hover { background: var(--bg-hover); }

        .trending-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .trending-tag {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .trending-count {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* ---------------------------------------------------------- */
        /* Avatar color palette (deterministic by user id)            */
        /* ---------------------------------------------------------- */
        .avatar-img {
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            user-select: none;
        }

        .avatar-default {
            background: #536471;
            color: #8899a6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .av-guest { background: #536471; }
        .av-0  { background: #1D9BF0; }
        .av-1  { background: #7856ff; }
        .av-2  { background: #00ba7c; }
        .av-3  { background: #ff7a00; }
        .av-4  { background: #f91880; }

        /* ---------------------------------------------------------- */
        /* Theme toggle button                                        */
        /* ---------------------------------------------------------- */
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 9999px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-primary);
            background: transparent;
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
            user-select: none;
            width: 100%;
            text-align: left;
        }

        .theme-toggle:hover { background: var(--bg-hover); }

        .theme-toggle-icon {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            transition: transform 0.3s;
        }

        .theme-toggle:hover .theme-toggle-icon { transform: rotate(20deg); }

        /* ---------------------------------------------------------- */
        /* Mobile — collapse sidebars below 768px                      */
        /* ---------------------------------------------------------- */
        @media (max-width: 1024px) {
            .layout { grid-template-columns: 72px 1fr 0; }
            .sidebar-right { display: none; }
            .logo-text { display: none; }
            .nav-item span { display: none; }
            .theme-toggle span { display: none; }
            .theme-toggle { justify-content: center; padding: 12px; }
            .nav-item { justify-content: center; padding: 12px; }
            .logo { justify-content: center; }
        }

        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-areas: "center";
            }
            .sidebar-left { display: none; }
            .timeline { border-right: none; }
        }

        /* ---------------------------------------------------------- */
        /* Scrollbar styling                                           */
        /* ---------------------------------------------------------- */
        /* Hide scrollbars but keep scroll functionality */
        .sidebar-right::-webkit-scrollbar { width: 0; display: none; }
        .sidebar-right { -ms-overflow-style: none; scrollbar-width: none; }

        /* ---------------------------------------------------------- */
        /* Registration modal                                          */
        /* ---------------------------------------------------------- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 400px;
            max-width: 90vw;
            text-align: center;
        }

        .modal-logo {
            width: 42px;
            height: 42px;
            fill: var(--accent);
            margin: 0 auto 16px;
            display: block;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .modal-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .modal-input {
            font-family: 'Inter', sans-serif;
            width: 100%;
            background: var(--bg-main);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 14px;
            transition: border-color 0.2s;
        }

        .modal-input:focus {
            border-color: var(--accent);
        }

        .modal-input::placeholder {
            color: var(--text-secondary);
        }

        .modal-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 700;
            transition: background 0.2s, transform 0.15s, opacity 0.2s;
            margin-top: 4px;
        }

        .modal-submit:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .modal-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .modal-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal-error {
            color: var(--like-color);
            font-size: 0.85rem;
            margin-top: 12px;
            min-height: 20px;
        }

        .modal-cancel {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-cancel:hover {
            background: var(--bg-hover);
        }

        /* ---------------------------------------------------------- */
        /* Profile view                                                */
        /* ---------------------------------------------------------- */
        .profile-view {
            min-height: 100vh;
        }

        .profile-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(21, 32, 43, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        [data-theme="light"] .profile-header {
            background: rgba(255, 255, 255, 0.85);
        }

        .back-btn {
            background: none;
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 9999px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: var(--bg-hover);
        }

        .profile-banner {
            height: 150px;
            background: linear-gradient(135deg, var(--accent), #7856ff);
        }

        .profile-info {
            padding: 0 20px 20px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            margin-top: -40px;
            border: 3px solid var(--bg-main);
            border-radius: 50%;
            overflow: hidden;
            background: var(--bg-card);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar .avatar-circle {
            width: 100%;
            height: 100%;
            font-size: 2rem;
        }

        .profile-settings-btn {
            padding: 8px 20px;
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 9999px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .profile-settings-btn:hover {
            background: var(--bg-hover);
        }

        .profile-name {
            font-size: 1.3rem;
            font-weight: 800;
            margin-top: 12px;
        }

        .profile-handle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .profile-bio {
            margin-top: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .profile-location, .profile-birthday {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .profile-stats {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .profile-stats strong {
            color: var(--text-primary);
        }

        .stat-link {
            cursor: pointer;
        }

        .stat-link:hover {
            text-decoration: underline;
        }

        .profile-tweets {
            border-top: 1px solid var(--border);
        }

        /* ---------------------------------------------------------- */
        /* Impression count (eye icon) — display only                 */
        /* ---------------------------------------------------------- */
        .impression-count {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 4px 8px;
        }

        /* ---------------------------------------------------------- */
        /* Like / repost user-list modal                              */
        /* ---------------------------------------------------------- */
        .user-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .user-list-item:last-child { border-bottom: none; }

        .user-list-info {
            flex: 1;
        }

        .user-list-name {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .user-list-handle {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* ---------------------------------------------------------- */
        /* Profile top row — avatar left, actions right               */
        /* ---------------------------------------------------------- */
        .profile-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: -40px;
        }

        .profile-actions {
            padding-top: 48px;
        }

        /* ---------------------------------------------------------- */
        /* Repost dropdown menu                                        */
        /* ---------------------------------------------------------- */
        .repost-menu {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            z-index: 100;
            overflow: hidden;
            min-width: 200px;
        }

        .repost-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: background 0.15s;
        }

        .repost-menu-item:hover {
            background: var(--bg-hover);
        }

        /* ---------------------------------------------------------- */
        /* Quote retweet embed preview                                 */
        /* ---------------------------------------------------------- */
        .quote-embed {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0 16px;
            font-size: 0.9rem;
        }

        .quote-embed-name {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .quote-embed-content {
            color: var(--text-primary);
            line-height: 1.4;
        }

        /* ---------------------------------------------------------- */
        /* Bookmark button                                            */
        /* ---------------------------------------------------------- */
        .bookmark-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 9999px;
            transition: color 0.2s, background 0.2s;
        }
        .bookmark-btn:hover { color: var(--accent); background: rgba(29,155,240,0.1); }
        .bookmark-btn.bookmarked { color: var(--accent); }

        /* ---------------------------------------------------------- */
        /* Bookmarks view                                             */
        /* ---------------------------------------------------------- */
        .bookmarks-view { min-height: 50vh; }

        /* ---------------------------------------------------------- */
        /* Tweet detail view                                           */
        /* ---------------------------------------------------------- */
        .tweet-detail-view { min-height: 50vh; }

        .tweet-detail-card {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .tweet-detail-user {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
        }

        .tweet-detail-content {
            font-size: 1.4rem;
            line-height: 1.6;
            margin-bottom: 16px;
            word-break: break-word;
        }

        .tweet-detail-time {
            font-size: 0.9rem;
            color: var(--text-secondary);
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .tweet-detail-stats {
            display: flex;
            gap: 20px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .tweet-detail-stats strong {
            color: var(--text-primary);
        }

        .tweet-detail-actions {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
    </style>
</head>

<body>
    <div class="layout">

        <!-- ============================================================ -->
        <!-- LEFT SIDEBAR                                                   -->
        <!-- ============================================================ -->
        <nav class="sidebar-left" aria-label="Main navigation">

            <div class="logo" role="banner">
                <!-- Bird SVG logo -->
                <svg class="logo-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53A4.48 4.48 0 0 0 22.43.36a9 9 0 0 1-2.88 1.1A4.52 4.52 0 0 0 16.11 0c-2.5 0-4.52 2.02-4.52 4.52 0 .35.04.7.11 1.03C7.69 5.37 4.07 3.6 1.64.9a4.54 4.54 0 0 0-.61 2.27c0 1.57.8 2.95 2.01 3.76a4.48 4.48 0 0 1-2.05-.57v.06c0 2.19 1.56 4.02 3.63 4.43a4.5 4.5 0 0 1-2.04.08 4.52 4.52 0 0 0 4.22 3.14A9.07 9.07 0 0 1 0 15.54a12.8 12.8 0 0 0 6.92 2.03c8.3 0 12.85-6.88 12.85-12.85 0-.2 0-.39-.01-.58A9.17 9.17 0 0 0 23 3z"/>
                </svg>
                <span class="logo-text">Twiiter</span>
            </div>

            <button class="nav-item active" id="home-nav" onclick="showTimeline()" aria-label="ホーム">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" stroke-width="0" fill="currentColor"/>
                </svg>
                <span>ホーム</span>
            </button>

            <button class="nav-item" id="search-nav" aria-label="探索" onclick="showSearch()">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <span>探索</span>
            </button>

            <button class="nav-item" id="notif-nav" aria-label="通知" onclick="showNotifications()">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span>通知</span>
                <span class="notif-badge" id="notif-badge" style="display:none"></span>
            </button>

            <button class="nav-item" id="bookmark-nav" aria-label="ブックマーク" onclick="showBookmarks()">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                </svg>
                <span>ブックマーク</span>
            </button>

            <button class="nav-item" aria-label="プロフィール" onclick="if(currentUser) showProfile(currentUser.handle); else showRegistrationModal();">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <span>プロフィール</span>
            </button>

            <!-- Theme toggle — between Profile and Tweet button -->
            <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" aria-label="テーマを切り替え">
                <!-- Moon icon shown in dark mode; sun icon shown in light mode -->
                <svg class="theme-toggle-icon" id="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <!-- Moon (default — dark theme active) -->
                    <path id="theme-icon-path" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <span id="theme-label">ライトモード</span>
            </button>

        </nav>

        <!-- ============================================================ -->
        <!-- CENTER TIMELINE                                               -->
        <!-- ============================================================ -->
        <main class="timeline" id="top">

            <div class="timeline-header">
                <h1>ホーム</h1>
            </div>

            <!-- Timeline tabs -->
            <div class="timeline-tabs" id="timeline-tabs">
                <button class="timeline-tab active" id="tab-recommended" onclick="switchTab(this)">おすすめ</button>
                <button class="timeline-tab" id="tab-following" onclick="switchTab(this)">フォロー中</button>
            </div>

            <!-- Compose box -->
            <section class="compose-box" aria-label="Compose a tweet">
                <div class="avatar-circle av-guest" id="compose-avatar" aria-hidden="true"></div>
                <div class="compose-right">
                    <textarea
                        id="compose-input"
                        class="compose-textarea"
                        placeholder="いまどうしてる？"
                        maxlength="280"
                        rows="3"
                        aria-label="ツイートの内容"
                    ></textarea>
                    <div id="compose-image-preview" style="display:none;position:relative;margin-top:8px">
                        <img id="compose-image-thumb" style="max-height:200px;border-radius:12px;width:100%;object-fit:cover" alt="">
                        <button onclick="clearComposeImage()" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);color:#fff;border-radius:50%;width:28px;height:28px;font-size:1rem;cursor:pointer;border:none" aria-label="画像を削除">&#x2715;</button>
                    </div>
                    <div class="compose-footer">
                        <div class="compose-tools">
                            <label style="cursor:pointer;color:var(--accent);padding:4px 8px;border-radius:9999px;transition:background 0.2s;display:flex;align-items:center" onmouseover="this.style.background='rgba(29,155,240,0.1)'" onmouseout="this.style.background='transparent'" aria-label="画像を添付">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                                <input type="file" id="compose-image-input" accept="image/*" style="display:none" onchange="previewComposeImage(this)">
                            </label>
                        </div>
                        <span class="char-counter" id="char-counter" aria-live="polite"></span>
                        <button
                            class="compose-submit"
                            id="compose-submit"
                            onclick="postTweet()"
                            aria-label="ツイートを投稿"
                        >ツイートする</button>
                    </div>
                </div>
            </section>

            <!-- Tweet feed -->
            <div id="tweet-feed" role="feed" aria-label="ツイートフィード">
                <div class="feed-placeholder">読み込み中…</div>
            </div>
        </main>

        <!-- ============================================================ -->
        <!-- RIGHT SIDEBAR                                                 -->
        <!-- ============================================================ -->
        <aside class="sidebar-right" aria-label="Sidebar">
          <div class="sidebar-right-inner">

            <!-- Recommended users panel -->
            <div class="panel">
                <div class="panel-header">おすすめユーザー</div>
                <div class="bot-list" id="bot-list">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Trending panel (placeholder) -->
            <div class="panel">
                <div class="panel-header">トレンド</div>
                <div class="trending-item">
                    <div class="trending-label">テクノロジーのトレンド</div>
                    <div class="trending-tag">#OpenSource</div>
                    <div class="trending-count">1.2万件のポスト</div>
                </div>
                <div class="trending-item">
                    <div class="trending-label">世界のトレンド</div>
                    <div class="trending-tag">#AI</div>
                    <div class="trending-count">8.9万件のポスト</div>
                </div>
                <div class="trending-item">
                    <div class="trending-label">プログラミングのトレンド</div>
                    <div class="trending-tag">#Python</div>
                    <div class="trending-count">3.4万件のポスト</div>
                </div>
                <div class="trending-item">
                    <div class="trending-label">トレンド</div>
                    <div class="trending-tag">#WebDev</div>
                    <div class="trending-count">8,700件のポスト</div>
                </div>
                <div class="trending-item trending-extra" style="display:none">
                    <div class="trending-label">エンタメのトレンド</div>
                    <div class="trending-tag">#アニメ</div>
                    <div class="trending-count">5.6万件のポスト</div>
                </div>
                <div class="trending-item trending-extra" style="display:none">
                    <div class="trending-label">ゲームのトレンド</div>
                    <div class="trending-tag">#原神</div>
                    <div class="trending-count">2.1万件のポスト</div>
                </div>
                <div class="trending-item trending-extra" style="display:none">
                    <div class="trending-label">スポーツのトレンド</div>
                    <div class="trending-tag">#Jリーグ</div>
                    <div class="trending-count">1.8万件のポスト</div>
                </div>
                <div class="trending-item trending-extra" style="display:none">
                    <div class="trending-label">日本のトレンド</div>
                    <div class="trending-tag">#確定申告</div>
                    <div class="trending-count">4.3万件のポスト</div>
                </div>
                <span class="show-more-link" id="trend-show-more">さらに表示</span>
            </div>
          </div><!-- /.sidebar-right-inner -->
        </aside>

    </div><!-- /.layout -->

    <!-- ================================================================ -->
    <!-- Registration modal                                                -->
    <!-- ================================================================ -->
    <div class="modal-overlay" id="registration-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" style="display:none;">
        <div class="modal-card">
            <svg class="modal-logo" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53A4.48 4.48 0 0 0 22.43.36a9 9 0 0 1-2.88 1.1A4.52 4.52 0 0 0 16.11 0c-2.5 0-4.52 2.02-4.52 4.52 0 .35.04.7.11 1.03C7.69 5.37 4.07 3.6 1.64.9a4.54 4.54 0 0 0-.61 2.27c0 1.57.8 2.95 2.01 3.76a4.48 4.48 0 0 1-2.05-.57v.06c0 2.19 1.56 4.02 3.63 4.43a4.5 4.5 0 0 1-2.04.08 4.52 4.52 0 0 0 4.22 3.14A9.07 9.07 0 0 1 0 15.54a12.8 12.8 0 0 0 6.92 2.03c8.3 0 12.85-6.88 12.85-12.85 0-.2 0-.39-.01-.58A9.17 9.17 0 0 0 23 3z"/>
            </svg>
            <h2 class="modal-title" id="modal-title">Twiiterへようこそ</h2>
            <p class="modal-subtitle">アカウントを作成してツイートしよう</p>
            <input
                type="text"
                id="reg-display-name"
                class="modal-input"
                placeholder="表示名"
                maxlength="50"
                aria-label="表示名"
            />
            <input
                type="text"
                id="reg-handle"
                class="modal-input"
                placeholder="@your_handle"
                maxlength="50"
                aria-label="ハンドル"
            />
            <button class="modal-submit" id="reg-submit" onclick="submitRegistration()">はじめる</button>
            <div class="modal-error" id="reg-error" aria-live="polite"></div>
        </div>
    </div>

    <!-- ================================================================ -->
    <!-- Profile Edit Modal                                                -->
    <!-- ================================================================ -->
    <div class="modal-overlay" id="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title" style="display:none">
        <div class="modal-card">
            <h2 class="modal-title" id="profile-modal-title">プロフィール編集</h2>
            <div style="margin-bottom:16px;text-align:left">
                <label style="display:block;font-size:0.85rem;color:var(--text-secondary);margin-bottom:6px">プロフィール画像</label>
                <input type="file" id="profile-avatar-file" accept="image/*" style="font-size:0.85rem;color:var(--text-secondary);width:100%">
            </div>
            <div style="margin-bottom:16px;text-align:left">
                <label style="display:block;font-size:0.85rem;color:var(--text-secondary);margin-bottom:6px">ヘッダー画像</label>
                <input type="file" id="profile-banner-file" accept="image/*" style="font-size:0.85rem;color:var(--text-secondary);width:100%">
            </div>
            <input type="text" class="modal-input" id="profile-display-name" placeholder="表示名" maxlength="50" aria-label="表示名">
            <textarea class="modal-input" id="profile-bio" placeholder="自己紹介（趣味、好きなもの、ひとことなど）" maxlength="160" rows="3" aria-label="自己紹介" style="resize:vertical;min-height:60px;font-family:'Inter',sans-serif;"></textarea>
            <input type="text" class="modal-input" id="profile-location" placeholder="場所" maxlength="30" aria-label="場所">
            <input type="text" class="modal-input" id="profile-birthday" placeholder="誕生日 (例: 1998/03/15)" maxlength="10" aria-label="誕生日">
            <div style="padding: 8px 0; color: var(--text-secondary); font-size: 0.9rem;" id="profile-handle-display"></div>
            <div class="modal-error" id="profile-error" aria-live="polite"></div>
            <button class="modal-submit" onclick="saveProfile()">保存</button>
            <button class="modal-cancel" onclick="hideProfileModal()">キャンセル</button>
        </div>
    </div>

    <!-- ================================================================ -->
    <!-- Like / Repost user list modal                                     -->
    <!-- ================================================================ -->
    <div class="modal-overlay" id="users-list-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="users-list-title">
        <div class="modal-card" style="max-height:70vh;overflow-y:auto;text-align:left">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <h2 class="modal-title" id="users-list-title" style="margin:0"></h2>
                <button onclick="document.getElementById('users-list-modal').style.display='none'" style="background:none;color:var(--text-secondary);font-size:1.2rem;padding:8px;cursor:pointer;border:none" aria-label="閉じる">&#x2715;</button>
            </div>
            <div id="users-list-content"></div>
        </div>
    </div>

    <!-- ================================================================ -->
    <!-- Image viewer modal                                                -->
    <!-- ================================================================ -->
    <div class="modal-overlay" id="image-modal" style="display:none" onclick="this.style.display='none'">
        <img id="image-modal-img" src="" style="max-width:90vw;max-height:90vh;border-radius:12px;object-fit:contain" alt="">
    </div>

    <!-- ================================================================ -->
    <!-- JavaScript                                                        -->
    <!-- ================================================================ -->
    <script>
        // ------------------------------------------------------------------
        // Current logged-in user (set by initApp)
        // ------------------------------------------------------------------
        var currentUser = null;

        // ------------------------------------------------------------------
        // Current view state — 'timeline' or 'profile'
        // ------------------------------------------------------------------
        var currentView = 'timeline';

        // ------------------------------------------------------------------
        // Current timeline tab — 'all' or 'following'
        // ------------------------------------------------------------------
        var currentTab = 'all';

        // ------------------------------------------------------------------
        // Avatar color class — deterministic from user id
        // ------------------------------------------------------------------
        function avatarClass(userId) {
            return 'av-' + (userId % 5);
        }

        // Build an avatar element — image if avatar_url exists, letter circle otherwise
        // Twitter-style default avatar SVG (person silhouette)
        function buildDefaultAvatar(size) {
            size = size || 42;
            var div = document.createElement('div');
            div.className = 'avatar-circle avatar-default';
            div.style.width = size + 'px';
            div.style.height = size + 'px';
            div.setAttribute('aria-hidden', 'true');
            div.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" style="width:60%;height:60%"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>';
            return div;
        }

        function buildAvatar(user, size) {
            size = size || 42;
            if (user.avatar_url) {
                var img = document.createElement('img');
                img.src = user.avatar_url;
                img.className = 'avatar-img';
                img.style.width = size + 'px';
                img.style.height = size + 'px';
                img.setAttribute('aria-hidden', 'true');
                img.alt = '';
                return img;
            }
            // No avatar_url → Twitter-style default silhouette
            return buildDefaultAvatar(size);
        }

        // ------------------------------------------------------------------
        // Image zoom modal
        // ------------------------------------------------------------------
        function showImageModal(url) {
            document.getElementById('image-modal-img').src = url;
            document.getElementById('image-modal').style.display = 'flex';
        }

        // ------------------------------------------------------------------
        // Update compose box avatar to reflect current user
        // ------------------------------------------------------------------
        function updateComposeAvatar() {
            var container = document.getElementById('compose-avatar');
            if (!container) return;
            // Replace the element entirely with buildAvatar
            var newAv;
            if (currentUser) {
                newAv = buildAvatar(currentUser, 42);
            } else {
                newAv = buildDefaultAvatar(42);
            }
            newAv.id = 'compose-avatar';
            newAv.setAttribute('aria-hidden', 'true');
            container.replaceWith(newAv);
        }

        // ------------------------------------------------------------------
        // Registration modal — show / hide
        // ------------------------------------------------------------------
        function showRegistrationModal() {
            document.getElementById('registration-modal').style.display = 'flex';
            document.getElementById('reg-display-name').focus();
        }

        function hideRegistrationModal() {
            document.getElementById('registration-modal').style.display = 'none';
        }

        function submitRegistration() {
            var displayName = document.getElementById('reg-display-name').value.trim();
            var handle = document.getElementById('reg-handle').value.trim();
            var errorEl = document.getElementById('reg-error');
            var submitBtn = document.getElementById('reg-submit');

            errorEl.textContent = '';

            if (!displayName) {
                errorEl.textContent = '表示名を入力してください。';
                return;
            }
            if (!handle) {
                errorEl.textContent = 'ハンドルを入力してください。';
                return;
            }

            // Auto-prepend @ if user forgot it
            if (!handle.startsWith('@')) {
                handle = '@' + handle;
            }

            submitBtn.disabled = true;

            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ display_name: displayName, handle: handle })
            })
            .then(function(res) { return res.json().then(function(data) { return { status: res.status, data: data }; }); })
            .then(function(result) {
                if (result.status === 200 || result.status === 201) {
                    currentUser = result.data.user;
                    hideRegistrationModal();
                    updateComposeAvatar();
                    loadTweets();
                    loadBotAccounts();
                } else {
                    errorEl.textContent = result.data.error || '登録に失敗しました。もう一度お試しください。';
                }
            })
            .catch(function(err) {
                console.error('Registration failed:', err);
                errorEl.textContent = '登録に失敗しました。もう一度お試しください。';
            })
            .finally(function() {
                submitBtn.disabled = false;
            });
        }

        // Allow Enter key in registration inputs to submit
        document.getElementById('reg-display-name').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { document.getElementById('reg-handle').focus(); }
        });
        document.getElementById('reg-handle').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { submitRegistration(); }
        });

        // "さらに表示" link in the trending panel — toggles 4 hidden extra items
        var trendExpanded = false;
        document.getElementById('trend-show-more').addEventListener('click', function() {
            var panel = this.closest('.panel');
            var extras = panel.querySelectorAll('.trending-extra');
            if (!trendExpanded) {
                extras.forEach(function(el) { el.style.display = ''; });
                this.textContent = '閉じる';
                trendExpanded = true;
            } else {
                extras.forEach(function(el) { el.style.display = 'none'; });
                this.textContent = 'さらに表示';
                trendExpanded = false;
            }
        });

        // ------------------------------------------------------------------
        // App initialisation — check cookie auth first
        // ------------------------------------------------------------------
        function initApp() {
            fetch('/api/me')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.user) {
                        currentUser = data.user;
                        updateComposeAvatar();
                        loadTweets();
                        loadBotAccounts();
                        pollNotifications();
                    } else {
                        showRegistrationModal();
                        // Still load tweets and bots in the background so they
                        // are ready when the modal closes
                        loadTweets();
                        loadBotAccounts();
                    }
                })
                .catch(function(err) {
                    console.error('Failed to check auth status:', err);
                    // Fall through — show app anyway and let tweet / like fail with 401
                    loadTweets();
                    loadBotAccounts();
                });
        }

        // ------------------------------------------------------------------
        // Relative timestamp
        // ------------------------------------------------------------------
        function timeAgo(dateStr) {
            // SQLite returns UTC timestamps without trailing Z — normalise.
            const normalized = dateStr.endsWith('Z') ? dateStr : dateStr + 'Z';
            const date = new Date(normalized);
            const now  = new Date();
            const diffMs = now - date;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHr  = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHr  / 24);

            if (diffSec < 0)   return 'たった今';  // future timestamp (clock skew)
            if (diffSec < 10)  return 'たった今';
            if (diffSec < 60)  return diffSec + '秒';
            if (diffMin < 60)  return diffMin + '分';
            if (diffHr  < 24)  return diffHr  + '時間';
            if (diffDay < 7)   return diffDay + '日';

            // Older than a week: show "3月15日" style
            return date.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' });
        }

        // ------------------------------------------------------------------
        // Render a single tweet card element (returns a DOM node)
        // ------------------------------------------------------------------
        function buildTweetCard(tweet) {
            const card = document.createElement('article');
            card.className = 'tweet-card';
            card.dataset.tweetId = tweet.id;

            const user = tweet.user;

            // Avatar (image or letter circle)
            const avatarEl = buildAvatar(user, 42);
            avatarEl.style.cursor = 'pointer';
            avatarEl.onclick = function() { showProfile(user.handle); };

            // Body
            const bodyEl = document.createElement('div');
            bodyEl.className = 'tweet-body';

            // Meta line
            const metaEl = document.createElement('div');
            metaEl.className = 'tweet-meta';

            const nameEl = document.createElement('span');
            nameEl.className = 'tweet-display-name';
            nameEl.textContent = user.display_name;
            nameEl.style.cursor = 'pointer';
            nameEl.onclick = function() { showProfile(user.handle); };

            const handleEl = document.createElement('span');
            handleEl.className = 'tweet-handle';
            handleEl.textContent = user.handle;
            handleEl.style.cursor = 'pointer';
            handleEl.onclick = function() { showProfile(user.handle); };

            const timeEl = document.createElement('span');
            timeEl.className = 'tweet-time';
            timeEl.textContent = timeAgo(tweet.created_at);
            timeEl.setAttribute('title', tweet.created_at);

            metaEl.appendChild(nameEl);
            metaEl.appendChild(handleEl);
            metaEl.appendChild(timeEl);

            // "···" more button — shown on all tweets, but delete menu only for own tweets
            var moreBtn = document.createElement('button');
            moreBtn.className = 'tweet-more-btn';
            moreBtn.innerHTML = '···';
            moreBtn.setAttribute('aria-label', 'その他のオプション');
            moreBtn.onclick = function(e) {
                e.stopPropagation();
                // Only show delete for own tweets
                if (!currentUser || tweet.user.id !== currentUser.id) return;

                var existing = document.querySelector('.tweet-context-menu');
                if (existing) existing.remove();

                var menu = document.createElement('div');
                menu.className = 'tweet-context-menu';

                var deleteItem = document.createElement('div');
                deleteItem.className = 'tweet-context-item delete';
                deleteItem.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> 削除';
                deleteItem.onclick = function(e) {
                    e.stopPropagation();
                    menu.remove();
                    if (confirm('このツイートを削除しますか？')) {
                        fetch('/api/tweets/' + tweet.id, { method: 'DELETE' })
                            .then(function() { loadTweets(); });
                    }
                };

                menu.appendChild(deleteItem);

                var rect = moreBtn.getBoundingClientRect();
                menu.style.position = 'fixed';
                menu.style.left = (rect.left - 120) + 'px';
                menu.style.top = (rect.bottom + 4) + 'px';
                document.body.appendChild(menu);

                setTimeout(function() {
                    document.addEventListener('click', function close() {
                        menu.remove();
                        document.removeEventListener('click', close);
                    }, { once: true });
                }, 10);
            };
            metaEl.appendChild(moreBtn);

            // Content
            const contentEl = document.createElement('div');
            contentEl.className = 'tweet-content';
            // Intentionally using innerHTML to make XSS easier for the lecture
            contentEl.innerHTML = tweet.content;
            // After setting innerHTML, wrap hashtags in clickable links
            contentEl.innerHTML = contentEl.innerHTML.replace(/#([^\s<]+)/g, '<a href="javascript:void(0)" onclick="searchHashtag(\'$1\')" style="color:var(--accent);text-decoration:none">#$1</a>');
            contentEl.style.cursor = 'pointer';
            contentEl.onclick = function(e) {
                // Don't trigger if clicking a link inside
                if (e.target.tagName === 'A') return;
                showTweetDetail(tweet.id);
            };

            // Action bar
            const actionsEl = document.createElement('div');
            actionsEl.className = 'tweet-actions';

            // Reply button (speech bubble icon)
            var replyBtn = document.createElement('button');
            replyBtn.className = 'reply-btn';
            replyBtn.setAttribute('aria-label', '返信');
            replyBtn.onclick = function() { toggleReplyBox(tweet.id); };

            var replySvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            replySvg.setAttribute('viewBox', '0 0 24 24');
            replySvg.setAttribute('width', '18');
            replySvg.setAttribute('height', '18');
            replySvg.setAttribute('aria-hidden', 'true');
            replySvg.style.fill = 'none';
            replySvg.style.stroke = 'currentColor';
            replySvg.style.strokeWidth = '2';

            var replyPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            replyPath.setAttribute('d', 'M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z');
            replySvg.appendChild(replyPath);

            var replyCountEl = document.createElement('span');
            replyCountEl.textContent = (tweet.reply_count && tweet.reply_count > 0) ? tweet.reply_count : '';

            replyBtn.appendChild(replySvg);
            replyBtn.appendChild(replyCountEl);
            actionsEl.appendChild(replyBtn);

            // Repost button
            var repostBtn = document.createElement('button');
            repostBtn.className = 'repost-btn' + (tweet.reposted ? ' reposted' : '');
            repostBtn.setAttribute('aria-label', 'リポスト');
            repostBtn.onclick = function(e) { e.stopPropagation(); showRepostMenu(tweet, repostBtn); };

            var repostSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            repostSvg.setAttribute('viewBox', '0 0 24 24');
            repostSvg.setAttribute('width', '18');
            repostSvg.setAttribute('height', '18');
            repostSvg.setAttribute('aria-hidden', 'true');
            repostSvg.style.fill = 'none';
            repostSvg.style.stroke = tweet.reposted ? '#00ba7c' : 'currentColor';
            repostSvg.style.strokeWidth = '2';
            repostSvg.style.strokeLinecap = 'round';
            repostSvg.style.strokeLinejoin = 'round';

            var repostPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            repostPath.setAttribute('d', 'M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3');
            repostSvg.appendChild(repostPath);

            var repostCountEl = document.createElement('span');
            repostCountEl.textContent = (tweet.reposts && tweet.reposts > 0) ? formatCount(tweet.reposts) : '';
            repostCountEl.style.cursor = (tweet.reposts && tweet.reposts > 0) ? 'pointer' : 'default';
            repostCountEl.onclick = function(e) {
                e.stopPropagation();
                if (tweet.reposts > 0) showUserList('リポストしたユーザー', '/api/tweets/' + tweet.id + '/reposts');
            };

            repostBtn.appendChild(repostSvg);
            repostBtn.appendChild(repostCountEl);
            actionsEl.appendChild(repostBtn);

            // Like button
            const likeBtn = document.createElement('button');
            likeBtn.className = 'like-btn' + (tweet.liked ? ' liked' : '');
            likeBtn.setAttribute('aria-label', 'Like tweet');
            likeBtn.setAttribute('aria-pressed', tweet.liked ? 'true' : 'false');
            likeBtn.onclick = function() { likeTweet(tweet.id); };

            const heartSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            heartSvg.setAttribute('viewBox', '0 0 24 24');
            heartSvg.setAttribute('width', '18');
            heartSvg.setAttribute('height', '18');
            heartSvg.setAttribute('aria-hidden', 'true');
            heartSvg.style.fill = tweet.liked ? 'var(--like-color)' : 'none';
            heartSvg.style.stroke = tweet.liked ? 'var(--like-color)' : 'currentColor';
            heartSvg.style.strokeWidth = '2';

            const heartPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            heartPath.setAttribute('d', 'M12 21.638h-.014C9.403 21.59 1.95 14.856 1.95 8.478c0-3.064 2.525-5.754 5.403-5.754 2.29 0 3.83 1.58 4.646 2.73.814-1.148 2.354-2.73 4.645-2.73 2.88 0 5.404 2.69 5.404 5.755 0 6.376-7.454 13.11-10.037 13.157H12z');
            heartSvg.appendChild(heartPath);

            const likeCountEl = document.createElement('span');
            likeCountEl.textContent = tweet.likes > 0 ? formatCount(tweet.likes) : '';
            likeCountEl.style.cursor = tweet.likes > 0 ? 'pointer' : 'default';
            likeCountEl.onclick = function(e) {
                e.stopPropagation();
                if (tweet.likes > 0) showUserList('いいねしたユーザー', '/api/tweets/' + tweet.id + '/likes');
            };

            likeBtn.appendChild(heartSvg);
            likeBtn.appendChild(likeCountEl);
            actionsEl.appendChild(likeBtn);

            // Impression count (eye icon) — display only
            var impressionBtn = document.createElement('span');
            impressionBtn.className = 'impression-count';
            impressionBtn.setAttribute('aria-label', 'インプレッション');

            var eyeSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            eyeSvg.setAttribute('viewBox', '0 0 24 24');
            eyeSvg.setAttribute('width', '18');
            eyeSvg.setAttribute('height', '18');
            eyeSvg.setAttribute('aria-hidden', 'true');
            eyeSvg.style.fill = 'none';
            eyeSvg.style.stroke = 'currentColor';
            eyeSvg.style.strokeWidth = '2';

            var eyePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            eyePath.setAttribute('d', 'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z');
            eyeSvg.appendChild(eyePath);
            var eyeCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            eyeCircle.setAttribute('cx', '12');
            eyeCircle.setAttribute('cy', '12');
            eyeCircle.setAttribute('r', '3');
            eyeSvg.appendChild(eyeCircle);

            var impCount = document.createElement('span');
            impCount.textContent = (tweet.impressions && tweet.impressions > 0) ? formatCount(tweet.impressions) : '';

            impressionBtn.appendChild(eyeSvg);
            impressionBtn.appendChild(impCount);
            actionsEl.appendChild(impressionBtn);

            // Bookmark button (flag icon)
            var bookmarkBtn = document.createElement('button');
            bookmarkBtn.className = 'bookmark-btn' + (tweet.bookmarked ? ' bookmarked' : '');
            bookmarkBtn.setAttribute('aria-label', 'ブックマーク');
            var bookmarkSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            bookmarkSvg.setAttribute('viewBox', '0 0 24 24');
            bookmarkSvg.setAttribute('width', '18');
            bookmarkSvg.setAttribute('height', '18');
            bookmarkSvg.setAttribute('aria-hidden', 'true');
            bookmarkSvg.style.fill = tweet.bookmarked ? 'var(--accent)' : 'none';
            bookmarkSvg.style.stroke = tweet.bookmarked ? 'var(--accent)' : 'currentColor';
            bookmarkSvg.style.strokeWidth = '2';
            var bookmarkPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            bookmarkPath.setAttribute('d', 'M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z');
            bookmarkSvg.appendChild(bookmarkPath);
            bookmarkBtn.appendChild(bookmarkSvg);
            (function(btn, svg, tweetData) {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    fetch('/api/tweets/' + tweetData.id + '/bookmark', { method: 'POST' })
                        .then(function(r) { return r.json(); })
                        .then(function(data) {
                            if (data.bookmarked) {
                                btn.classList.add('bookmarked');
                                svg.style.fill = 'var(--accent)';
                                svg.style.stroke = 'var(--accent)';
                            } else {
                                btn.classList.remove('bookmarked');
                                svg.style.fill = 'none';
                                svg.style.stroke = 'currentColor';
                            }
                        });
                };
            })(bookmarkBtn, bookmarkSvg, tweet);
            actionsEl.appendChild(bookmarkBtn);

            bodyEl.appendChild(metaEl);
            bodyEl.appendChild(contentEl);

            // Tweet image display
            if (tweet.image_url) {
                var imgContainer = document.createElement('div');
