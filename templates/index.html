<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 幻想のひとこと掲示板 ✨</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Cinzel:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-glow: #e6c875;
            --background-dark: #0f111a;
            --glass-bg: rgba(20, 25, 40, 0.45);
            --glass-border: rgba(230, 200, 117, 0.3);
            --text-main: #fcf8e8;
            --text-muted: #b8a67a;
        }

        body {
            font-family: 'Kaisei Decol', serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 10%, #2a223a 0%, var(--background-dark) 80%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            position: relative;
        }

        /* Starry background effect */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0, 0, 0, 0)),
                radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0, 0, 0, 0)),
                radial-gradient(1.5px 1.5px at 150px 150px, #ffffff, rgba(0, 0, 0, 0)),
                radial-gradient(1px 1px at 90px 40px, rgba(255, 255, 255, 0.8), rgba(0, 0, 0, 0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.5;
            z-index: -1;
            animation: twinkle 5s infinite linear;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.3;
                transform: translateY(0);
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 0.3;
                transform: translateY(-10px);
            }
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 40px 20px;
            padding: 40px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(230, 200, 117, 0.1) inset;
            position: relative;
        }

        h1 {
            font-family: 'Cinzel', 'Kaisei Decol', serif;
            text-align: center;
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 30px;
            color: var(--primary-glow);
            text-shadow: 0 0 15px rgba(230, 200, 117, 0.5);
            letter-spacing: 2px;
            border-bottom: 1px solid transparent;
            padding-bottom: 15px;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary-glow), transparent);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: rgba(10, 15, 25, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            color: var(--text-main);
            font-family: 'Kaisei Decol', serif;
            font-size: 1.1rem;
            resize: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(230, 200, 117, 0.2);
            background: rgba(10, 15, 25, 0.8);
        }

        textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
            font-style: italic;
        }

        /* File Upload Styling */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }

        .file-upload-btn {
            background: rgba(230, 200, 117, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 30px;
            font-family: 'Kaisei Decol', serif;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .file-upload-wrapper:hover .file-upload-btn {
            background: rgba(230, 200, 117, 0.2);
            box-shadow: 0 0 10px rgba(230, 200, 117, 0.2);
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #1a1a1a;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-family: 'Kaisei Decol', serif;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            letter-spacing: 1px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #eadd89, #d4af37);
        }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(230, 200, 117, 0.3), transparent);
            margin: 35px 0;
        }

        #posts {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .post {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px solid var(--primary-glow);
            padding: 18px 20px;
            border-radius: 8px;
            line-height: 1.6;
            font-size: 1.05rem;
            animation: fadeIn 0.8s ease forwards;
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease, background 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .post:hover {
            transform: scale(1.01);
            background: rgba(255, 255, 255, 0.06);
        }

        .post-media {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            max-height: 300px;
            object-fit: cover;
            display: block;
            margin-top: 10px;
        }

        .post-file-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 5px;
            color: var(--primary-glow);
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid rgba(230, 200, 117, 0.2);
            width: fit-content;
        }

        .post-file-link:hover {
            background: rgba(230, 200, 117, 0.1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Helper to hide file name text if empty */
        #fileName {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-left: 10px;
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>✨ 幻想のひとこと掲示板 ✨</h1>
        <form id="postForm" enctype="multipart/form-data">
            <textarea name="content" id="content" placeholder="星降る夜に、何を想う？" required></textarea>

            <div class="controls-row">
                <div class="file-upload-wrapper">
                    <button type="button" class="file-upload-btn">
                        <span>📎 魔法の欠片を添える</span>
                    </button>
                    <input type="file" name="file" id="fileInput"
                        onchange="document.getElementById('fileName').textContent = this.files[0] ? this.files[0].name : ''">
                    <span id="fileName"></span>
                </div>

                <button type="submit">言の葉を紡ぐ</button>
            </div>
        </form>
        <hr>
        <div id="posts">
            <!-- Posts will be loaded here via JS -->
        </div>
    </div>

    <script>
        // Track the highest ID we have seen so far to prevent reloading the whole list
        let lastHighestId = 0;

        function loadPosts() {
            fetch('/api/posts')
                .then(response => response.json())
                .then(data => {
                    const postsDiv = document.getElementById('posts');
                    // Store the current highest ID before processing new data
                    const currentHighestId = data.posts.length > 0 ? data.posts[0].id : 0;

                    // Only process posts that are newer than our last known ID
                    // Data is received in DESC order (newest first).
                    const newPosts = data.posts.filter(post => post.id > lastHighestId);

                    // We must append newer posts at the TOP of the container. 
                    // Since newPosts has the newest item at index 0, we process it backwards to use prepend properly,
                    // or just loop normally and insert before the first child.
                    for (let i = newPosts.length - 1; i >= 0; i--) {
                        const post = newPosts[i];
                        const div = document.createElement('div');
                        div.className = 'post';
                        div.id = 'post-' + post.id;

                        // Handle potential media
                        let mediaHtml = '';
                        if (post.file_path) {
                            const ext = post.file_path.split('.').pop().toLowerCase();
                            // If it's an image, display it
                            if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) {
                                mediaHtml = `<img src="${post.file_path}" class="post-media" alt="魔法の欠片">`;
                            } else {
                                // Default file download link
                                mediaHtml = `<a href="${post.file_path}" class="post-file-link" download>📎 添付された古文書を解読する</a>`;
                            }
                        }

                        // Intentionally using innerHTML to make XSS easier for the lecture
                        const contentHtml = `<div class="post-text">${post.content}</div>`;
                        div.innerHTML = contentHtml + mediaHtml;

                        // Insert at the top
                        if (postsDiv.firstChild) {
                            postsDiv.insertBefore(div, postsDiv.firstChild);
                        } else {
                            postsDiv.appendChild(div);
                        }
                    }

                    // Update the tracker
                    lastHighestId = Math.max(lastHighestId, currentHighestId);
                });
        }

        document.getElementById('postForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            fetch('/post', {
                method: 'POST',
                body: formData
            }).then(() => {
                // Clear inputs
                document.getElementById('content').value = '';
                document.getElementById('fileInput').value = '';
                document.getElementById('fileName').textContent = '';
                // Immediately load the new post
                loadPosts();
            });
        });

        // Load posts initially and every 2 seconds
        loadPosts();
        setInterval(loadPosts, 2000);
    </script>
</body>

</html>
