                imgContainer.style.cssText = 'margin-top:8px;border-radius:16px;overflow:hidden;border:1px solid var(--border)';
                var tweetImg = document.createElement('img');
                tweetImg.src = tweet.image_url;
                tweetImg.style.cssText = 'width:100%;max-height:400px;object-fit:cover;display:block;cursor:pointer';
                tweetImg.alt = '';
                (function(url) {
                    tweetImg.onclick = function(e) { e.stopPropagation(); showImageModal(url); };
                })(tweet.image_url);
                imgContainer.appendChild(tweetImg);
                bodyEl.appendChild(imgContainer);
            }

            // Quoted tweet embed — fetch and show if this is a quote retweet
            if (tweet.quote_of_id) {
                var quoteWrap = document.createElement('div');
                quoteWrap.className = 'quote-embed';
                quoteWrap.style.cursor = 'pointer';
                quoteWrap.innerHTML = '<div style="color:var(--text-secondary);font-size:0.85rem">読み込み中...</div>';
                bodyEl.appendChild(quoteWrap);

                (function(wrap, qid) {
                    fetch('/api/tweets/' + qid)
                        .then(function(r) { return r.json(); })
                        .then(function(d) {
                            if (d.tweet) {
                                var qt = d.tweet;
                                // Intentionally using innerHTML to match XSS pattern
                                wrap.innerHTML = '<div class="quote-embed-name">' + qt.user.display_name
                                    + ' <span style="color:var(--text-secondary);font-weight:400">' + qt.user.handle + '</span></div>'
                                    + '<div class="quote-embed-content">' + qt.content + '</div>';
                                wrap.onclick = function() { showProfile(qt.user.handle); };
                            }
                        })
                        .catch(function() {
                            wrap.innerHTML = '<div style="color:var(--text-secondary);font-size:0.85rem">ツイートを読み込めませんでした</div>';
                        });
                })(quoteWrap, tweet.quote_of_id);
            }

            bodyEl.appendChild(actionsEl);

            card.appendChild(avatarEl);
            card.appendChild(bodyEl);

            return card;
        }

        // ------------------------------------------------------------------
        // Render a reply card (visually indented, smaller than tweet-card)
        // ------------------------------------------------------------------
        function buildReplyCard(tweet) {
            const card = document.createElement('article');
            card.className = 'reply-card';
            card.dataset.tweetId = tweet.id;

            const user = tweet.user;

            // Avatar (smaller for replies)
            const avatarEl = buildAvatar(user, 32);
            avatarEl.style.cursor = 'pointer';
            avatarEl.onclick = function() { showProfile(user.handle); };

            // Body
            const bodyEl = document.createElement('div');
            bodyEl.className = 'tweet-body';

            // Meta line
            const metaEl = document.createElement('div');

        // ------------------------------------------------------------------
        // Load all tweets and render the timeline
        // ------------------------------------------------------------------
        var knownTweetIds = new Set();
        var lastTweetsHash = '';

        function loadTweets() {
            var tweetsUrl = '/api/tweets';
            if (currentTab === 'following') {
                tweetsUrl += '?filter=following';
            }
            fetch(tweetsUrl)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    // Skip re-render if nothing changed (prevents flicker)
                    var newHash = JSON.stringify(data.tweets.map(function(t) {
                        return [t.id, t.likes, t.liked, t.reply_to_id, t.quote_of_id];
                    }));
                    if (newHash === lastTweetsHash) return;
                    lastTweetsHash = newHash;

                    var feed = document.getElementById('tweet-feed');

                    // Full re-render so reply grouping stays correct
                    feed.innerHTML = '';
                    knownTweetIds.clear();

                    // Separate top-level tweets and replies
                    var topLevel = [];
                    var repliesMap = {};  // parent_id -> [replies]

                    data.tweets.forEach(function(tweet) {
                        if (tweet.reply_to_id) {
                            if (!repliesMap[tweet.reply_to_id]) {
                                repliesMap[tweet.reply_to_id] = [];
                            }
                            repliesMap[tweet.reply_to_id].push(tweet);
                        } else {
                            topLevel.push(tweet);
                        }
                    });

                    // Recursive function to render replies and their sub-replies
                    function renderReplies(parentId, container, depth) {
                        var replies = repliesMap[parentId];
                        if (!replies) return;
                        replies.sort(function(a, b) { return a.id - b.id; });
                        var repliesContainer = document.createElement('div');
                        repliesContainer.className = 'tweet-replies';
                        if (depth > 1) repliesContainer.style.marginLeft = '20px';
                        replies.forEach(function(reply) {
                            repliesContainer.appendChild(buildReplyCard(reply));
                            knownTweetIds.add(reply.id);
                            // Recursively render sub-replies (max depth 5)
                            if (depth < 5 && repliesMap[reply.id]) {
                                renderReplies(reply.id, repliesContainer, depth + 1);
                            }
                        });
                        container.appendChild(repliesContainer);
                    }

                    // Render top-level tweets (API returns DESC — newest first)
                    topLevel.forEach(function(tweet) {
                        var card = buildTweetCard(tweet);
                        feed.appendChild(card);
                        knownTweetIds.add(tweet.id);

                        // Attach replies recursively
                        if (repliesMap[tweet.id]) {
                            card.classList.add('has-replies');
                            renderReplies(tweet.id, feed, 1);
                        }
                    });

                    if (topLevel.length === 0 && Object.keys(repliesMap).length === 0) {
                        if (currentTab === 'following') {
                            feed.innerHTML = '<div class="feed-placeholder"><div style="font-size:1.2rem;font-weight:700;margin-bottom:8px;color:var(--text-primary)">フォロー中のユーザーの投稿がありません</div><div>ユーザーをフォローするとここに表示されます</div></div>';
                        } else {
                            feed.innerHTML = '<div class="feed-placeholder"><div style="font-size:1.8rem;font-weight:800;margin-bottom:8px;color:var(--text-primary)">ようこそ</div><div>最初のツイートを投稿してみましょう</div></div>';
                        }
                    }
                })
                .catch(function(err) {
                    console.error('Failed to load tweets:', err);
                });
        }

        // ------------------------------------------------------------------
        // Post a new tweet
        // ------------------------------------------------------------------
        function postTweet() {
            var textarea = document.getElementById('compose-input');
            var content = textarea.value.trim();
            if (!content && !composeImageFile) return;

            var submitBtn = document.getElementById('compose-submit');
            submitBtn.disabled = true;

            var fetchOptions;
            if (composeImageFile) {
                var formData = new FormData();
                formData.append('content', content);
                formData.append('image', composeImageFile);
                fetchOptions = { method: 'POST', body: formData };
            } else {
                fetchOptions = {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                };
            }

            fetch('/api/tweets', fetchOptions)
            .then(function(res) {
                if (res.status === 401) {
                    showRegistrationModal();
                    return null;
                }
                return res.json();
            })
            .then(function(data) {
                if (!data) return;
                textarea.value = '';
                clearComposeImage();
                updateCharCounter();
                loadTweets();
            })
            .catch(function(err) {
                console.error('Failed to post tweet:', err);
            })
            .finally(function() {
                submitBtn.disabled = false;
            });
        }

        // ------------------------------------------------------------------
        // Like / unlike a tweet
        // ------------------------------------------------------------------
        function likeTweet(tweetId) {
            fetch('/api/tweets/' + tweetId + '/like', { method: 'POST' })
                .then(function(res) {
                    if (res.status === 401) {
                        showRegistrationModal();
                        return null;
                    }
                    return res.json();
                })
                .then(function(data) {
                    if (!data) return;
                    const feed = document.getElementById('tweet-feed');
                    const card = feed.querySelector('[data-tweet-id="' + tweetId + '"]');
                    if (!card) return;

                    const likeBtn = card.querySelector('.like-btn');
                    const likeCount = likeBtn.querySelector('span');
                    const svg = likeBtn.querySelector('svg');

                    if (data.liked) {
                        likeBtn.classList.add('liked');
                        likeBtn.setAttribute('aria-pressed', 'true');
                        if (svg) { svg.style.fill = 'var(--like-color)'; svg.style.stroke = 'var(--like-color)'; }
                    } else {
                        likeBtn.classList.remove('liked');
                        likeBtn.setAttribute('aria-pressed', 'false');
                        if (svg) { svg.style.fill = 'none'; svg.style.stroke = 'currentColor'; }
                    }
                    if (likeCount) likeCount.textContent = data.likes > 0 ? data.likes : '';
                })
                .catch(function(err) {
                    console.error('Failed to like tweet:', err);
                });
        }

        // ------------------------------------------------------------------
        // Repost dropdown menu — リポスト or 引用リポスト
        // ------------------------------------------------------------------
        function showRepostMenu(tweet, anchorEl) {
            // Remove any existing menu
            var existing = document.querySelector('.repost-menu');
            if (existing) existing.remove();

            var menu = document.createElement('div');
            menu.className = 'repost-menu';

            var repostOption = document.createElement('div');
            repostOption.className = 'repost-menu-item';
            repostOption.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg> リポスト';
            repostOption.onclick = function(e) {
                e.stopPropagation();
                menu.remove();
                toggleRepost(tweet.id);
            };

            var quoteOption = document.createElement('div');
            quoteOption.className = 'repost-menu-item';
            quoteOption.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> 引用リポスト';
            quoteOption.onclick = function(e) {
                e.stopPropagation();
                menu.remove();
                showQuoteCompose(tweet);
            };

            menu.appendChild(repostOption);
            menu.appendChild(quoteOption);

            // Position near the button
            var rect = anchorEl.getBoundingClientRect();
            menu.style.position = 'fixed';
            menu.style.left = rect.left + 'px';
            menu.style.top = (rect.bottom + 4) + 'px';

            document.body.appendChild(menu);

            // Close when clicking outside
            setTimeout(function() {
                document.addEventListener('click', function closeMenu() {
                    menu.remove();
                    document.removeEventListener('click', closeMenu);
                }, { once: true });
            }, 10);
        }

        // ------------------------------------------------------------------
        // Quote retweet compose modal
        // ------------------------------------------------------------------
        function showQuoteCompose(quotedTweet) {
            var modal = document.getElementById('quote-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.id = 'quote-modal';
                modal.onclick = function(e) { if (e.target === modal) modal.style.display = 'none'; };

                var card = document.createElement('div');
                card.className = 'modal-card';
                card.style.maxWidth = '500px';

                var textarea = document.createElement('textarea');
                textarea.className = 'modal-input';
                textarea.id = 'quote-textarea';
                textarea.placeholder = 'コメントを追加...';
                textarea.maxLength = 280;
                textarea.rows = 3;
                textarea.style.resize = 'vertical';
                textarea.style.fontFamily = "'Inter', sans-serif";

                var preview = document.createElement('div');
                preview.id = 'quote-preview';
                preview.className = 'quote-embed';

                var submitBtn = document.createElement('button');
                submitBtn.className = 'modal-submit';
                submitBtn.textContent = 'ツイートする';
                submitBtn.id = 'quote-submit';

                card.appendChild(textarea);
                card.appendChild(preview);
                card.appendChild(submitBtn);
                modal.appendChild(card);
                document.body.appendChild(modal);
            }

            // Fill preview with the quoted tweet content (intentional innerHTML for XSS demo)
            var preview = document.getElementById('quote-preview');
            preview.innerHTML = '<div class="quote-embed-name">' + quotedTweet.user.display_name
                + ' <span style="color:var(--text-secondary)">' + quotedTweet.user.handle + '</span></div>'
                + '<div class="quote-embed-content">' + quotedTweet.content + '</div>';

            document.getElementById('quote-textarea').value = '';
            document.getElementById('quote-submit').onclick = function() {
                var content = document.getElementById('quote-textarea').value.trim();
                if (!content) return;
                fetch('/api/tweets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content, quote_of_id: quotedTweet.id })
                })
                .then(function(res) {
                    if (res.status === 401) { showRegistrationModal(); return null; }
                    return res.json();
                })
                .then(function(data) {
                    if (!data) return;
                    modal.style.display = 'none';
                    loadTweets();
                });
            };

            modal.style.display = 'flex';
            document.getElementById('quote-textarea').focus();
        }

        // ------------------------------------------------------------------
        // Repost / un-repost a tweet
        // ------------------------------------------------------------------
        function toggleRepost(tweetId) {
            fetch('/api/tweets/' + tweetId + '/repost', { method: 'POST' })
                .then(function(res) {
                    if (res.status === 401) { showRegistrationModal(); return null; }
                    return res.json();
                })
                .then(function(data) {
                    if (!data) return;
                    var feed = document.getElementById('tweet-feed');
                    var card = feed.querySelector('[data-tweet-id="' + tweetId + '"]');
                    if (!card) return;
                    var repostBtn = card.querySelector('.repost-btn');
                    var repostCount = repostBtn.querySelector('span');
                    var svg = repostBtn.querySelector('svg');
                    if (data.reposted) {
                        repostBtn.classList.add('reposted');
                        if (svg) svg.style.stroke = '#00ba7c';
                    } else {
                        repostBtn.classList.remove('reposted');
                        if (svg) svg.style.stroke = 'currentColor';
                    }
                    if (repostCount) repostCount.textContent = data.reposts > 0 ? data.reposts : '';
                })
                .catch(function(err) {
                    console.error('Failed to repost tweet:', err);
                });
        }

        // ------------------------------------------------------------------
        // Notifications tab view (Twitter-style, replaces timeline content)
        // ------------------------------------------------------------------
        function showNotifications(fromPopstate) {
            currentView = 'notifications';
            window.scrollTo(0, 0);
            if (!fromPopstate) pushView('notifications');

            var timeline = document.getElementById('top');
            var tabs = document.getElementById('timeline-tabs');
            if (tabs) tabs.style.display = 'none';
            var composeBox = timeline.querySelector('.compose-box');
            var feed = document.getElementById('tweet-feed');
            if (composeBox) composeBox.style.display = 'none';
            if (feed) feed.style.display = 'none';

            // Remove existing views
            ['profile-view', 'notif-view', 'search-view', 'tweet-detail-view', 'bookmarks-view'].forEach(function(cls) {
                var el = timeline.querySelector('.' + cls);
                if (el) el.remove();
            });

            // Update header
            var header = timeline.querySelector('.timeline-header h1');
            if (header) header.textContent = '通知';

            // Update nav active states
            document.querySelectorAll('.nav-item').forEach(function(btn) {
                btn.classList.remove('active');
            });
            var notifNav = document.getElementById('notif-nav');
            if (notifNav) notifNav.classList.add('active');

            var view = document.createElement('div');
            view.className = 'notif-view';

            // Loading state
            view.innerHTML = '<div style="padding:40px 20px;text-align:center;color:var(--text-secondary)">読み込み中…</div>';
            timeline.appendChild(view);

            // Fetch and render
            fetch('/api/notifications')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    view.innerHTML = '';

                    // Auto mark as read
                    if (data.unread_count > 0) {
                        fetch('/api/notifications/read', { method: 'POST' });
                        updateNotifBadge(0);
                    }

                    if (!data.notifications || data.notifications.length === 0) {
                        view.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--text-secondary)">まだ通知はありません</div>';
                        return;
                    }

                    data.notifications.forEach(function(n) {
                        var item = document.createElement('div');
                        item.className = 'notif-item' + (n.read ? '' : ' unread');

                        var iconDiv = document.createElement('div');
                        iconDiv.className = 'notif-icon ' + (n.type === 'like' ? 'like-icon' : 'reply-icon');
                        if (n.type === 'like') {
                            iconDiv.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 21.638h-.014C9.403 21.59 1.95 14.856 1.95 8.478c0-3.064 2.525-5.754 5.403-5.754 2.29 0 3.83 1.58 4.646 2.73.814-1.148 2.354-2.73 4.645-2.73 2.88 0 5.404 2.69 5.404 5.755 0 6.376-7.454 13.11-10.037 13.157H12z"/></svg>';
                        } else {
                            iconDiv.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';
                        }

                        // Actor avatar — use buildAvatar for consistency
                        var actorUser = {
                            id: n.actor_id,
                            display_name: n.actor_name,
                            avatar_url: n.actor_avatar,
                            handle: n.actor_handle
                        };
                        var avDiv = buildAvatar(actorUser, 40);

                        var textDiv = document.createElement('div');
                        textDiv.className = 'notif-text';
                        var actorSpan = '<span class="notif-actor">' + (n.actor_name || '') + '</span>';
                        if (n.type === 'like') {
                            textDiv.innerHTML = actorSpan + 'さんがあなたのツイートにいいねしました';
                        } else {
                            textDiv.innerHTML = actorSpan + 'さんがあなたのツイートに返信しました';
                        }
                        var timeDiv = document.createElement('div');
                        timeDiv.className = 'notif-time';
                        timeDiv.textContent = timeAgo(n.created_at);
                        textDiv.appendChild(timeDiv);

                        item.appendChild(iconDiv);
                        item.appendChild(avDiv);
                        item.appendChild(textDiv);
                        item.style.cursor = 'pointer';
                        (function(tweetId) {
                            item.onclick = function() {
                                if (tweetId) showTweetDetail(tweetId);
                            };
                        })(n.tweet_id);
                        view.appendChild(item);
                    });
                })
                .catch(function(err) {
                    console.error('Failed to load notifications:', err);
                    view.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--text-secondary)">まだ通知はありません</div>';
                });
        }

            item.onclick = function(e) {

            info.className = 'bot-info';

            var name = document.createElement('div');
            name.className = 'bot-name';
            name.textContent = bot.display_name;

            followBtn.onclick = function(e) {

        function loadBotAccounts() {
            fetch('/api/users')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    var botList = document.getElementById('bot-list');
                    botList.innerHTML = '';
                    var bots = data.users.filter(function(u) { return u.is_bot; });
                    // Shuffle randomly
                    for (var i = bots.length - 1; i > 0; i--) {
                        var j = Math.floor(Math.random() * (i + 1));
                        var tmp = bots[i]; bots[i] = bots[j]; bots[j] = tmp;
                    }
                    var showCount = Math.min(bots.length, 5);

                    for (var i = 0; i < showCount; i++) {
                        botList.appendChild(buildBotItem(bots[i]));
                    }

                    if (bots.length > 5) {
                        var expanded = false;
                        var extraItems = [];
                        var toggle = document.createElement('div');
                        toggle.className = 'show-more-link';
                        toggle.textContent = 'さらに表示';
                        toggle.onclick = function() {
                            if (!expanded) {
                                for (var j = 5; j < bots.length; j++) {
                                    var item = buildBotItem(bots[j]);
                                    extraItems.push(item);
                                    botList.insertBefore(item, toggle);
                                }
                                toggle.textContent = '閉じる';
                                expanded = true;
                            } else {
                                extraItems.forEach(function(el) { el.remove(); });
                                extraItems = [];
                                toggle.textContent = 'さらに表示';
                                expanded = false;
                            }
                        };
                        botList.appendChild(toggle);
                    }
                })
                .catch(function(err) {
                    console.error('Failed to load users:', err);
                });
        }

        // ------------------------------------------------------------------
        // Character counter — SVG progress ring
        // ------------------------------------------------------------------
        function updateCharCounter() {
            var textarea = document.getElementById('compose-input');
            var counter = document.getElementById('char-counter');
            var submitBtn = document.getElementById('compose-submit');
            var remaining = 280 - textarea.value.length;
            var progress = textarea.value.length / 280;

            // SVG circle progress ring
            var radius = 10;
            var circumference = 2 * Math.PI * radius;
            var offset = circumference * (1 - Math.min(progress, 1));

            var color = remaining <= 0 ? 'var(--like-color)' : remaining <= 20 ? '#fbbf24' : 'var(--accent)';

            counter.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">'
                + '<circle cx="12" cy="12" r="' + radius + '" fill="none" stroke="var(--border)" stroke-width="2"/>'
                + '<circle cx="12" cy="12" r="' + radius + '" fill="none" stroke="' + color + '" stroke-width="2" '
                + 'stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '" '
                + 'transform="rotate(-90 12 12)" stroke-linecap="round"/>'
                + (remaining <= 20 ? '<text x="12" y="16" text-anchor="middle" font-size="8" fill="' + color + '">' + remaining + '</text>' : '')
                + '</svg>';

            submitBtn.disabled = remaining < 0 || (textarea.value.trim().length === 0 && !composeImageFile);
        }

        document.getElementById('compose-input').addEventListener('input', updateCharCounter);
        // Initialize the ring on page load
        updateCharCounter();

        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme');
            var next = current === 'light' ? 'dark' : 'light';

            applyTheme(next);

        // ------------------------------------------------------------------
        // Inline reply compose box — toggle / submit
        // ------------------------------------------------------------------
        function toggleReplyBox(tweetId) {
            var existingBox = document.getElementById('reply-box-' + tweetId);
            if (existingBox) {
                existingBox.remove();
                return;
            }

            // Close any other open reply boxes
            document.querySelectorAll('.inline-reply-box').forEach(function(box) { box.remove(); });

            var card = document.querySelector('[data-tweet-id="' + tweetId + '"]');
            if (!card) return;

            var replyBox = document.createElement('div');
            replyBox.className = 'inline-reply-box';
            replyBox.id = 'reply-box-' + tweetId;

            var textarea = document.createElement('textarea');
            textarea.className = 'reply-textarea';
            textarea.placeholder = '返信をツイート...';
            textarea.maxLength = 280;

            var submitBtn = document.createElement('button');
            submitBtn.className = 'reply-submit';
            submitBtn.textContent = '返信';
            submitBtn.onclick = function() { submitReply(tweetId, textarea.value); };

            // Handle Enter key (Ctrl/Cmd+Enter to submit)
            textarea.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    submitReply(tweetId, textarea.value);
                }
            });

            replyBox.appendChild(textarea);
            replyBox.appendChild(submitBtn);

            // Insert after the card — handle both top-level tweets and reply cards
            // (card may be inside .tweet-replies container for reply cards)
            if (card.nextSibling) {
                card.parentNode.insertBefore(replyBox, card.nextSibling);
            } else {
                card.parentNode.appendChild(replyBox);
            }
            textarea.focus();
        }

        function submitReply(tweetId, content) {
            content = content.trim();
            if (!content) return;

            fetch('/api/tweets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content, reply_to_id: tweetId })
            })
            .then(function(res) {
                if (res.status === 401) {
                    showRegistrationModal();
                    return null;
                }
                return res.json();
            })
            .then(function(data) {
                if (!data) return;
                var box = document.getElementById('reply-box-' + tweetId);
                if (box) box.remove();
                loadTweets();
            });
        }

                    replyTextarea.maxLength = 280;

                    var replySubmit = document.createElement('button');
                    replySubmit.className = 'reply-submit';
                    replySubmit.textContent = '返信';

                        fetch('/api/tweets', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ content: content, reply_to_id: tweet.id })
                        }).then(function(res) {
                            if (res.status === 401) { showRegistrationModal(); return; }
                            return res.json();
                        }).then(function() {
                            // Refresh the detail view to show the new reply
                            showTweetDetail(tweetId);
                        });

                    detailReplyBox.appendChild(replyAvatar);
                    detailReplyBox.appendChild(replyTextarea);
                    detailReplyBox.appendChild(replySubmit);
                    card.appendChild(detailReplyBox);

                    view.appendChild(card);

                    // Show replies to this tweet below
                    // Fetch all tweets (no filter) to find replies
                    fetch('/api/tweets')
                        .then(function(r) { return r.json(); })
                        .then(function(allData) {
                            // Build a replies map for recursive rendering
                            var repliesMap = {};
                            allData.tweets.forEach(function(t) {
                                if (t.reply_to_id) {
                                    if (!repliesMap[t.reply_to_id]) repliesMap[t.reply_to_id] = [];
                                    repliesMap[t.reply_to_id].push(t);
                                }
                            });

                            var directReplies = repliesMap[tweet.id];
                            if (directReplies && directReplies.length > 0) {
                                var repliesHeader = document.createElement('div');
                                repliesHeader.style.cssText = 'padding:14px 20px;font-weight:700;border-top:1px solid var(--border);border-bottom:1px solid var(--border)';

                                directReplies.forEach(function(reply) {
                                    view.appendChild(buildTweetCard(reply));

                                    // Also render sub-replies recursively
                                    if (repliesMap[reply.id]) {
                                        var subContainer = document.createElement('div');
                                        subContainer.className = 'tweet-replies';
                                        repliesMap[reply.id].sort(function(a, b) { return a.id - b.id; });
                                        repliesMap[reply.id].forEach(function(subReply) {
                                            subContainer.appendChild(buildReplyCard(subReply));
                                        });
                                        view.appendChild(subContainer);
                                    }
                                });
                            }
                        });
                });
        }

        // ------------------------------------------------------------------
        // Search view — user and tweet search with tabs
        // ------------------------------------------------------------------
        function showSearch(fromPopstate) {
            currentView = 'search';
            window.scrollTo(0, 0);
            if (!fromPopstate) pushView('search');

            var timeline = document.getElementById('top');
            var tabs = document.getElementById('timeline-tabs');
            if (tabs) tabs.style.display = 'none';
            var composeBox = timeline.querySelector('.compose-box');
            var feed = document.getElementById('tweet-feed');
            if (composeBox) composeBox.style.display = 'none';
            if (feed) feed.style.display = 'none';

            // Remove other views
            ['profile-view', 'notif-view', 'search-view', 'tweet-detail-view', 'bookmarks-view'].forEach(function(cls) {
                var el = timeline.querySelector('.' + cls);
                if (el) el.remove();
            });

            var header = timeline.querySelector('.timeline-header h1');
            if (header) header.textContent = '探索';

            // Update nav active state
            document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
            var searchNav = document.getElementById('search-nav');
            if (searchNav) searchNav.classList.add('active');

            var view = document.createElement('div');
            view.className = 'search-view';

            // Search input
            var searchBar = document.createElement('div');
            searchBar.className = 'search-bar';
            var searchInput = document.createElement('input');
            searchInput.type = 'text';
            searchInput.className = 'search-input';
            searchInput.placeholder = 'ユーザーまたはツイートを検索';
            searchInput.id = 'search-input';
            searchBar.appendChild(searchInput);
            view.appendChild(searchBar);

            // Search mode tabs: ユーザー / ツイート
            var searchTabs = document.createElement('div');
            searchTabs.className = 'timeline-tabs';
            var userTab = document.createElement('button');
            userTab.className = 'timeline-tab active';
            userTab.textContent = 'ユーザー';
            var tweetTab = document.createElement('button');
            tweetTab.className = 'timeline-tab';
            tweetTab.textContent = 'ツイート';
            searchTabs.appendChild(userTab);
            searchTabs.appendChild(tweetTab);
            view.appendChild(searchTabs);

            var results = document.createElement('div');
            results.id = 'search-results';
            view.appendChild(results);

            timeline.appendChild(view);
            searchInput.focus();

            var searchMode = 'users'; // 'users' or 'tweets'

            userTab.onclick = function() {
                userTab.classList.add('active');
                tweetTab.classList.remove('active');
                searchMode = 'users';
                var q = searchInput.value.trim();
                if (q) runSearch(q);
                else results.innerHTML = '';
            };
            tweetTab.onclick = function() {
                tweetTab.classList.add('active');
                userTab.classList.remove('active');
                searchMode = 'tweets';
                var q = searchInput.value.trim();
                if (q) runSearch(q);
                else results.innerHTML = '';
            };

            function runSearch(q) {
                if (searchMode === 'users') {
                    fetch('/api/users/search?q=' + encodeURIComponent(q))
                        .then(function(r) { return r.json(); })
                        .then(function(data) {
                            results.innerHTML = '';
                            if (!data.users || data.users.length === 0) {
                                results.innerHTML = '<div style="padding:40px 20px;text-align:center;color:var(--text-secondary)">見つかりませんでした</div>';
                                return;
                            }
                            data.users.forEach(function(u) {
                                var item = document.createElement('div');
                                item.className = 'search-result-item';
                                item.onclick = function() { showProfile(u.handle); };
                                var av = buildAvatar(u, 42);
                                var info = document.createElement('div');
                                info.className = 'search-result-info';
                                var name = document.createElement('div');
                                name.className = 'search-result-name';
                                name.textContent = u.display_name;
                                var handle = document.createElement('div');
                                handle.className = 'search-result-handle';
                                handle.textContent = u.handle;
                                info.appendChild(name);
                                info.appendChild(handle);
                                if (u.bio) {
                                    var bio = document.createElement('div');
                                    bio.className = 'search-result-bio';
                                    bio.textContent = u.bio.length > 80 ? u.bio.substring(0, 80) + '...' : u.bio;
                                    info.appendChild(bio);
                                }
                                item.appendChild(av);
                                item.appendChild(info);
                                results.appendChild(item);
                            });
                        })
                        .catch(function(err) { console.error('Search failed:', err); });
                } else {
                    // Tweet search — use /api/tweets/search endpoint
                    fetch('/api/tweets/search?q=' + encodeURIComponent(q))
                        .then(function(r) { return r.json(); })
                        .then(function(data) {
                            results.innerHTML = '';
                            if (!data.tweets || data.tweets.length === 0) {
                                results.innerHTML = '<div style="padding:40px 20px;text-align:center;color:var(--text-secondary)">見つかりませんでした</div>';
                                return;
                            }
                            data.tweets.forEach(function(tweet) {
                                results.appendChild(buildTweetCard(tweet));
                            });
                        })
                        .catch(function(err) { console.error('Tweet search failed:', err); });
                }
            }

            // Debounced search
            var debounceTimer;
            searchInput.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                var q = searchInput.value.trim();
                if (!q) {
                    results.innerHTML = '';
                    return;
                }
                debounceTimer = setTimeout(function() { runSearch(q); }, 300);
            });
        }

            // Merge and sort all tweets by created_at for use in tab rendering
            var allTweets = (tweets || []).slice();
            if (repostedTweets) {
                repostedTweets.forEach(function(rt) {
                    rt._reposted_by = user.display_name;
                    allTweets.push(rt);
                });
            }
            allTweets.sort(function(a, b) {
                return new Date(b.created_at) - new Date(a.created_at);
            });

            var tweetsContainer = document.createElement('div');
            tweetsContainer.className = 'profile-tweets';

            // Build reply map for tweet grouping
            var profileRepliesMap = {};
            allTweets.forEach(function(tweet) {
                if (tweet.reply_to_id && !tweet._reposted_by) {
                    if (!profileRepliesMap[tweet.reply_to_id]) profileRepliesMap[tweet.reply_to_id] = [];
                    profileRepliesMap[tweet.reply_to_id].push(tweet);
                }
            });

            function renderProfileTweets(container, filter) {
                container.innerHTML = '';
                var filtered;
                if (filter === 'ツイート') {
                    filtered = allTweets.filter(function(t) { return !t.reply_to_id || t._reposted_by; });
                } else if (filter === '返信') {
                    filtered = allTweets.filter(function(t) { return t.reply_to_id && !t._reposted_by; });
                } else if (filter === 'メディア') {
                    filtered = allTweets.filter(function(t) { return t.image_url; });
                } else if (filter === 'いいね') {
                    container.innerHTML = '<div class="feed-placeholder">いいねしたツイートはここに表示されます</div>';
                    return;
                } else {
                    filtered = [];
                }

                if (!filtered || filtered.length === 0) {
                    container.innerHTML = '<div class="feed-placeholder">まだありません</div>';
                    return;
                }

                filtered.forEach(function(tweet) {
                    if (tweet._reposted_by) {
                        var repostWrapper = document.createElement('div');
                        repostWrapper.style.cssText = 'border-bottom:1px solid var(--border)';
                        var repostLabel = document.createElement('div');
                        repostLabel.style.cssText = 'padding:10px 20px 0 64px;font-size:0.8rem;color:var(--text-secondary);display:flex;align-items:center;gap:6px;font-weight:500';
                        repostLabel.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg> ' + tweet._reposted_by + 'さんがリポスト';
                        var card = buildTweetCard(tweet);
                        card.style.borderBottom = 'none';
                        card.style.paddingBottom = '10px';
                        repostWrapper.appendChild(repostLabel);
                        repostWrapper.appendChild(card);
                        container.appendChild(repostWrapper);
                    } else {
                        var card = buildTweetCard(tweet);
                        container.appendChild(card);
                        if (profileRepliesMap[tweet.id]) {
                            card.classList.add('has-replies');
                            (function renderRepliesR(parentId, cont, depth) {
                                var reps = profileRepliesMap[parentId];
                                if (!reps) return;
                                reps.sort(function(a, b) { return a.id - b.id; });
                                var rc = document.createElement('div');
                                rc.className = 'tweet-replies';
                                if (depth > 1) rc.style.marginLeft = '20px';
                                reps.forEach(function(reply) {
                                    rc.appendChild(buildReplyCard(reply));
                                    if (depth < 5 && profileRepliesMap[reply.id]) {
                                        renderRepliesR(reply.id, rc, depth + 1);
                                    }
                                });
                                cont.appendChild(rc);
                            })(tweet.id, container, 1);
                        }
                    }
                });
            }

            ['ツイート', '返信', 'メディア', 'いいね'].forEach(function(label, idx) {
                var tab = document.createElement('button');
                tab.className = 'timeline-tab' + (idx === 0 ? ' active' : '');
                tab.textContent = label;
                tab.onclick = function() {
                    profileTabs.querySelectorAll('.timeline-tab').forEach(function(t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    renderProfileTweets(tweetsContainer, label);
                };
                profileTabs.appendChild(tab);
            });
            view.appendChild(profileTabs);

            // Render default tab (ツイート)
            renderProfileTweets(tweetsContainer, 'ツイート');
            view.appendChild(tweetsContainer);

            timeline.appendChild(view);
        }

        function showProfileModal() {
            if (!currentUser) {
                showRegistrationModal();
                return;
            }
            document.getElementById('profile-display-name').value = currentUser.display_name;
            document.getElementById('profile-bio').value = currentUser.bio || '';

        function hideProfileModal() {
            document.getElementById('profile-modal').style.display = 'none';
        }

        function saveProfile() {
            var displayName = document.getElementById('profile-display-name').value.trim();
            var bio = document.getElementById('profile-bio').value.trim();
            var location = document.getElementById('profile-location').value.trim();
            var birthday = document.getElementById('profile-birthday').value.trim();
            if (!displayName) {
                document.getElementById('profile-error').textContent = '表示名を入力してください';
                return;
            }

            var avatarFile = document.getElementById('profile-avatar-file').files[0];
            var bannerFile = document.getElementById('profile-banner-file').files[0];

            var uploads = [];

            if (avatarFile) {
                var avatarData = new FormData();
                avatarData.append('file', avatarFile);
                uploads.push(
                    fetch('/api/me/avatar', { method: 'POST', body: avatarData })
                        .then(function(r) { return r.json(); })
                );
            }

            if (bannerFile) {
                var bannerData = new FormData();
                bannerData.append('file', bannerFile);
                uploads.push(
                    fetch('/api/me/banner', { method: 'POST', body: bannerData })
                        .then(function(r) { return r.json(); })
                );
            }

            Promise.all(uploads).then(function() {
                return fetch('/api/me', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ display_name: displayName, bio: bio, location: location, birthday: birthday })
                });
            })
            .then(function(res) {
                if (!res.ok) return res.json().then(function(d) { throw new Error(d.error); });
                return res.json();
            })
            .then(function(data) {
                currentUser = data.user;
                updateComposeAvatar();
                hideProfileModal();
                // Clear file inputs
                document.getElementById('profile-avatar-file').value = '';
                document.getElementById('profile-banner-file').value = '';
                // Refresh current view
                if (currentView === 'profile') {
                    showProfile(currentUser.handle);
                } else {
                    loadTweets();
                }
            })
            .catch(function(err) {
                document.getElementById('profile-error').textContent = err.message;
            });
        }

        // ------------------------------------------------------------------
        // Format large counts (e.g. 12345 → "1.2万", 1500 → "1.5K")

        function formatCount(n) {
            if (n >= 10000) return (n / 10000).toFixed(1) + '万';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
            return String(n);
        }

                        if (currentUser && u.id === currentUser.id) {
                            followBtn = null;
                        } else if (u.is_following) {
                            followBtn.textContent = 'フォロー中';
                            followBtn.style.background = 'transparent';
                            followBtn.style.color = 'var(--text-primary)';
                            followBtn.style.border = '1px solid var(--text-secondary)';
                        } else {
                            followBtn.textContent = 'フォローする';
                        }

                        if (followBtn) {
                            (function(btn, uid) {
                                btn.onclick = function(e) {
                                    e.stopPropagation();
                                    fetch('/api/users/' + uid + '/follow', { method: 'POST' })
                                        .then(function(r) { return r.json(); })
                                        .then(function(d) {
                                            if (d.following) {
                                                btn.textContent = 'フォロー中';
                                                btn.style.background = 'transparent';
                                                btn.style.color = 'var(--text-primary)';
                                                btn.style.border = '1px solid var(--text-secondary)';
                                            } else {
                                                btn.textContent = 'フォローする';
                                                btn.style.background = 'var(--text-primary)';
                                                btn.style.color = 'var(--bg-main)';
                                                btn.style.border = 'none';
                                            }
                                        });
                                };
                            })(followBtn, u.id);
                        }

                        item.appendChild(av);
                        item.appendChild(info);
                        if (followBtn) item.appendChild(followBtn);
                        content.appendChild(item);
                    });
                });
        }

        // Close users-list modal when clicking the overlay background
        document.getElementById('users-list-modal').addEventListener('click', function(e) {
            if (e.target === this) this.style.display = 'none';
        });

        // ------------------------------------------------------------------
        // SPA history management (browser back/forward)
        // ------------------------------------------------------------------
        function pushView(view, params) {
            var state = { view: view };
            if (params) state.params = params;
            history.pushState(state, '', '');
        }

        window.addEventListener('popstate', function(e) {
            var state = e.state;
            if (!state || !state.view || state.view === 'timeline') {
                showTimeline(true);
            } else if (state.view === 'profile' && state.params) {
                showProfile(state.params, true);
            } else if (state.view === 'notifications') {
                showNotifications(true);
            } else if (state.view === 'search') {
                showSearch(true);
            } else if (state.view === 'tweet-detail' && state.params) {
                showTweetDetail(state.params, true);
            } else if (state.view === 'bookmarks') {
                showBookmarks(true);
            } else {
                showTimeline(true);
            }
        });

        // ------------------------------------------------------------------
        // Initialise
        // ------------------------------------------------------------------
        history.replaceState({ view: 'timeline' }, '', '');
        initApp();

        // Auto-refresh timeline and notification badge every 10 seconds
        // Skip tweet refresh when not in timeline view to prevent overwriting it
        setInterval(function() {
            if (currentView === 'timeline') { loadTweets(); }
            if (currentView !== 'search' && currentView !== 'tweet-detail') { pollNotifications(); }
        }, 10000);
    </script>
</body>

</html>
