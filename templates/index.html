                            ALLOWED_TAGS: ['b', 'i', 'em', 'strong', 'a', 'p', 'br', 'ul', 'ol', 'li', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'code', 'pre', 'blockquote', 'span', 'del', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6'],
                            ALLOWED_ATTR: ['href', 'class', 'target', 'rel', 'onclick'],
                            ADD_ATTR: ['onclick']
                        });

                        bubbleDiv.insertAdjacentHTML('beforeend', safeHTML);

                        const actionsDiv = document.createElement('div');
                        actionsDiv.className = 'message-actions';
                        if (isMyMessage) actionsDiv.style.justifyContent = 'flex-end';

                        const timeSpan = document.createElement('span');
                        timeSpan.textContent = post.timestamp || '';

                        const replyBtn = document.createElement('i');
                        replyBtn.className = 'bi bi-reply-fill';
                        replyBtn.title = '返信';
                        replyBtn.onclick = () => setReply(post.id, post.username, post.content);

                        const editBtn = document.createElement('i');
                        editBtn.className = 'bi bi-pencil-fill text-secondary';
                        editBtn.title = '編集';
                        if (isMyMessage) editBtn.onclick = () => editPost(post.id, post.content);

                        const deleteBtn = document.createElement('i');
                        deleteBtn.className = 'bi bi-trash3-fill text-danger';
                        deleteBtn.title = '削除';
                        if (isMyMessage) deleteBtn.onclick = () => deletePost(post.id);

                        actionsDiv.appendChild(timeSpan);
                        actionsDiv.appendChild(replyBtn);
                        if (isMyMessage) {
                            actionsDiv.appendChild(editBtn);
                            actionsDiv.appendChild(deleteBtn);
                        }

                        wrapperDiv.appendChild(nameDiv);
                        wrapperDiv.appendChild(bubbleDiv);
                        wrapperDiv.appendChild(actionsDiv);
                        postsDiv.appendChild(wrapperDiv);
                    });

                    if (isScrolledToBottom) {
                        postsDiv.scrollTop = postsDiv.scrollHeight;
                    }
                });
        }

        // --- Table Mode Logic ---
        let isTableMode = false;
        function toggleTableMode() {
            isTableMode = !isTableMode;
            const btn = document.getElementById('toggleTableModeBtn');
            const panel = document.getElementById('tableBuilderPanel');
            const textarea = document.getElementById('content');

            if (isTableMode) {
                btn.classList.add('active');
                btn.innerHTML = '<i class="bi bi-x"></i> 表モードを閉じる';
                panel.style.display = 'flex';
                textarea.style.display = 'none';
                textarea.removeAttribute('required');
                submitBtn.removeAttribute('disabled');
                if (document.getElementById('tableGridContainer').innerHTML === '') generateTableGrid();
            } else {
                btn.classList.remove('active');
                btn.innerHTML = '<i class="bi bi-table"></i> 表を作成する';
                panel.style.display = 'none';
                textarea.style.display = 'block';
                textarea.setAttribute('required', 'true');
                if (textarea.value.trim().length === 0) submitBtn.setAttribute('disabled', 'true');
            }
        }

        function generateTableGrid() {
            const rows = parseInt(document.getElementById('tblRows').value) || 3;
            const cols = parseInt(document.getElementById('tblCols').value) || 3;
            const container = document.getElementById('tableGridContainer');
            let html = '<table><thead><tr>';
            for (let c = 0; c < cols; c++) html += `<th><input type="text" class="tbl-cell" data-row="-1" data-col="${c}" placeholder="見出し ${c + 1}"></th>`;
            html += '</tr></thead><tbody>';
            for (let r = 0; r < rows; r++) {
                html += '<tr>';
                for (let c = 0; c < cols; c++) html += `<td><input type="text" class="tbl-cell" data-row="${r}" data-col="${c}" placeholder="データ"></td>`;
                html += '</tr>';
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        document.getElementById('postForm').addEventListener('submit', function (e) {
            e.preventDefault();
            let contentVal = "";

            if (isTableMode) {
                const rows = parseInt(document.getElementById('tblRows').value) || 0;
                const cols = parseInt(document.getElementById('tblCols').value) || 0;
                let headerLine = "|", sepLine = "|";
                for (let c = 0; c < cols; c++) {
                    const el = document.querySelector(`input.tbl-cell[data-row="-1"][data-col="${c}"]`);
                    headerLine += ` ${el ? el.value.replace(/\|/g, '\\|') : ''} |`;
                    sepLine += "---|";
                }
                contentVal += headerLine + "\n" + sepLine + "\n";
                for (let r = 0; r < rows; r++) {
                    let rLine = "|";
                    for (let c = 0; c < cols; c++) {
                        const el = document.querySelector(`input.tbl-cell[data-row="${r}"][data-col="${c}"]`);
                        rLine += ` ${el ? el.value.replace(/\|/g, '\\|') : ''} |`;
                    }
                    contentVal += rLine + "\n";
                }
            } else {
                contentVal = document.getElementById('content').value.trim();
            }

            if (!contentVal.trim() || !currentRoomId) return;

            const formData = new FormData();
            formData.append('content', contentVal);
            formData.append('username', currentUsername);
            formData.append('reply_to_id', document.getElementById('replyToId').value);
            formData.append('room_id', currentRoomId);
            formData.append('team_id', getActiveChatTeamId());

            if (!isTableMode) {
                document.getElementById('content').value = '';
                document.getElementById('content').style.height = '48px';
                submitBtn.setAttribute('disabled', 'true');
            } else {
                generateTableGrid();
                toggleTableMode(); // Close mode implicitly
            }
            cancelReply();

            fetch('/post', { method: 'POST', body: formData });
            // Socket broadcast triggers reload locally.
        });

        // --- Three.js Top Page Background ---
        (function initTopBackground() {
            const canvas = document.getElementById('topBgCanvas');
            if (!canvas) return;
            const bgScene = new THREE.Scene();
            const bgCamera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
            bgCamera.position.z = 30;
            const bgRenderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            bgRenderer.setSize(canvas.clientWidth, canvas.clientHeight);
            bgRenderer.setClearColor(0xf7f7f8, 1);

            // Create floating geometric shapes
            const shapes = [];
            const geos = [
                new THREE.IcosahedronGeometry(1, 0),
                new THREE.OctahedronGeometry(1, 0),
                new THREE.TorusGeometry(0.7, 0.3, 8, 16),
                new THREE.TetrahedronGeometry(1, 0)
            ];
            const colors = [0xcbd5e1, 0x94a3b8, 0xe2e8f0, 0xa5b4cf, 0xb8c5d9];

            for (let i = 0; i < 20; i++) {
                const geo = geos[Math.floor(Math.random() * geos.length)];
                const mat = new THREE.MeshPhongMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    transparent: true,
                    opacity: 0.3 + Math.random() * 0.2,
                    flatShading: true
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(
                    (Math.random() - 0.5) * 40,
                    (Math.random() - 0.5) * 30,
                    (Math.random() - 0.5) * 20 - 5
                );
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                const scale = 0.5 + Math.random() * 1.5;
                mesh.scale.set(scale, scale, scale);
                bgScene.add(mesh);
                shapes.push({
                    mesh: mesh,
                    rotSpeed: { x: (Math.random() - 0.5) * 0.02, y: (Math.random() - 0.5) * 0.02 },
                    floatSpeed: 0.008 + Math.random() * 0.012,
                    floatOffset: Math.random() * Math.PI * 2
                });
            }

            const ambLight = new THREE.AmbientLight(0xffffff, 0.8);
            bgScene.add(ambLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.3);
            dirLight.position.set(5, 10, 5);
            bgScene.add(dirLight);

            function animateBg() {
                requestAnimationFrame(animateBg);
                const t = Date.now() * 0.001;
                shapes.forEach(s => {
                    s.mesh.rotation.x += s.rotSpeed.x;
                    s.mesh.rotation.y += s.rotSpeed.y;
                    s.mesh.position.y += Math.sin(t * 1.5 + s.floatOffset) * s.floatSpeed;
                });
                bgRenderer.render(bgScene, bgCamera);
            }
            animateBg();

            window.addEventListener('resize', () => {
                if (canvas.clientWidth > 0 && canvas.clientHeight > 0) {
                    bgCamera.aspect = canvas.clientWidth / canvas.clientHeight;
                    bgCamera.updateProjectionMatrix();
                    bgRenderer.setSize(canvas.clientWidth, canvas.clientHeight);
                }
            });
        })();

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
