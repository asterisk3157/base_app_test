<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 星に願いを ✨</title>
    <!-- Google Fonts for a magical/fantasy feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Kaisei+Decol:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --text-main: #e8e0d0;
            --text-muted: #a09882;
            --primary-glow: #e6c875;
            --glass-bg: rgba(10, 12, 20, 0.55);
            --glass-border: rgba(230, 200, 117, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Kaisei Decol', serif;
            color: var(--text-main);
        }

        /* === Full-screen Background === */
        body {
            background: url('/static/img/bg_window.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: row;
        }

        /* === LEFT PANEL: YouTube Live Style Comment Feed === */
        .comment-feed {
            width: 320px;
            min-width: 280px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px 15px 20px 15px;
            background: linear-gradient(to right, rgba(5, 5, 15, 0.75) 0%, rgba(5, 5, 15, 0.4) 80%, transparent 100%);
            position: relative;
            z-index: 10;
        }

        .feed-title {
            position: absolute;
            top: 20px;
            left: 15px;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--primary-glow);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(230, 200, 117, 0.4);
        }

        .feed-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 50px;
            padding-right: 5px;
            /* Hide scrollbar for cleaner YouTube Live look */
            scrollbar-width: thin;
            scrollbar-color: rgba(230, 200, 117, 0.2) transparent;
        }

        .feed-container::-webkit-scrollbar {
            width: 4px;
        }

        .feed-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .feed-container::-webkit-scrollbar-thumb {
            background: rgba(230, 200, 117, 0.3);
            border-radius: 10px;
        }

        /* Each comment bubble */
        .comment {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 12px;
            padding: 8px 12px;
            animation: commentSlideIn 0.4s ease-out forwards;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            word-break: break-word;
        }

        .comment-name {
            font-size: 0.75rem;
            color: var(--primary-glow);
            font-weight: bold;
            margin-bottom: 2px;
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }

        .comment-text {
            font-size: 0.88rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        .comment-media {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 5px;
            max-height: 150px;
            object-fit: cover;
            display: block;
        }

        .comment-file-link {
            display: inline-block;
            margin-top: 5px;
            padding: 4px 10px;
            border-radius: 5px;
            background: rgba(230, 200, 117, 0.1);
            color: var(--primary-glow);
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid rgba(230, 200, 117, 0.15);
        }

        .comment-file-link:hover {
            background: rgba(230, 200, 117, 0.2);
        }

        @keyframes commentSlideIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === CENTER SPACER: Just the background showing through === */
        .center-space {
            flex: 1;
        }

        /* === RIGHT PANEL: Input Forms === */
        .input-panel {
            width: 360px;
            min-width: 300px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px 20px 25px 20px;
            background: linear-gradient(to left, rgba(5, 5, 15, 0.7) 0%, rgba(5, 5, 15, 0.35) 80%, transparent 100%);
            position: relative;
            z-index: 10;
        }

        .input-panel .panel-title {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--primary-glow);
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(230, 200, 117, 0.5);
        }

        .input-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 15px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-box textarea {
            width: 100%;
            height: 80px;
            background: rgba(10, 15, 25, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text-main);
            font-family: 'Kaisei Decol', serif;
            font-size: 0.95rem;
            resize: none;
            transition: all 0.3s ease;
        }

        .input-box textarea:focus {
            outline: none;
            border-color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(230, 200, 117, 0.15);
        }

        .input-box textarea::placeholder,
        .input-box input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
            font-style: italic;
        }

        .input-box input[type="text"] {
            width: 100%;
            background: rgba(10, 15, 25, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-main);
            font-family: 'Kaisei Decol', serif;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .input-box input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(230, 200, 117, 0.15);
        }

        .tripcode-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            opacity: 0.75;
            margin-top: -5px;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        /* File upload */
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }

        .file-upload-btn {
            background: rgba(230, 200, 117, 0.08);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 7px 14px;
            border-radius: 20px;
            font-family: 'Kaisei Decol', serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload-wrapper:hover .file-upload-btn {
            background: rgba(230, 200, 117, 0.18);
        }

        #fileName {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: 5px;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #1a1a1a;
            border: none;
            padding: 9px 22px;
            border-radius: 20px;
            font-family: 'Kaisei Decol', serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 3px 12px rgba(212, 175, 55, 0.3);
            letter-spacing: 1px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 18px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #eadd89, #d4af37);
        }

        /* === Responsive === */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }

            .comment-feed {
                width: 100%;
                height: 50vh;
                background: rgba(5, 5, 15, 0.7);
            }

            .center-space {
                display: none;
            }

            .input-panel {
                width: 100%;
                height: auto;
                background: rgba(5, 5, 15, 0.8);
            }
        }
    </style>
</head>

<body>
    <!-- LEFT: YouTube Live style comment feed -->
    <div class="comment-feed">
        <div class="feed-title">✨ 星に願いを</div>
        <div class="feed-container" id="posts">
            <!-- Posts will be loaded here via JS -->
        </div>
    </div>

    <!-- CENTER: Just the background image showing through -->
    <div class="center-space"></div>

    <!-- RIGHT: Input panel for posting -->
    <div class="input-panel">
        <div class="panel-title">💫 願いを紡ぐ</div>
        <form id="postForm" enctype="multipart/form-data">
            <div class="input-box">
                <textarea name="content" id="content" placeholder="星に何を願う？" required onpaste="return false;"
                    ondrop="return false;"></textarea>

                <div class="controls-row">
                    <div class="file-upload-wrapper">
                        <button type="button" class="file-upload-btn">📎 添える</button>
                        <input type="file" name="file" id="fileInput"
                            accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.gif,.webp">
                    </div>
                    <span id="fileName"></span>
                    <button type="submit">願いを紡ぐ</button>
                </div>

                <input type="text" name="name" id="name" placeholder="詠み人（名前） / 秘密は # の後ろに" maxlength="50"
                    onpaste="return false;" ondrop="return false;">
                <div class="tripcode-hint">※ 名前#呪文 → あなただけの刻印(トリップ) 例: アリス#alice</div>
            </div>
        </form>
    </div>

    <script>
        // File input explicit client-side validation
        document.getElementById('fileInput').addEventListener('change', function () {
            const fileNameDisplay = document.getElementById('fileName');
            const file = this.files[0];

            if (file) {
                const allowedExtensions = ['pdf', 'doc', 'docx', 'png', 'jpg', 'jpeg', 'gif', 'webp'];
                const fileExt = file.name.split('.').pop().toLowerCase();

                if (!allowedExtensions.includes(fileExt)) {
                    alert('この魔導書（ファイル形式）は解読できません。\n対応フォーマット: ' + allowedExtensions.join(', '));
                    this.value = '';
                    fileNameDisplay.textContent = '';
                } else {
                    fileNameDisplay.textContent = file.name;
                }
            } else {
                fileNameDisplay.textContent = '';
            }
        });

        // Track the highest ID we have seen so far
        let lastHighestId = 0;
        let isInitialLoad = true;

        function renderPost(post, container) {
            const div = document.createElement('div');
            div.className = 'comment';
            div.id = 'post-' + post.id;

            // Name / Tripcode
            const nameDiv = document.createElement('div');
            nameDiv.className = 'comment-name';
            nameDiv.textContent = post.name || '名無しの魔法使い';
            div.appendChild(nameDiv);

            // Content (safe from XSS)
            const textDiv = document.createElement('div');
            textDiv.className = 'comment-text';
            textDiv.textContent = post.content;
            div.appendChild(textDiv);

            // Handle media
            if (post.file_path) {
                const ext = post.file_path.split('.').pop().toLowerCase();
                if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) {
                    const img = document.createElement('img');
                    img.src = post.file_path;
                    img.className = 'comment-media';
                    img.alt = '魔法の欠片';
                    div.appendChild(img);
                } else if (ext === 'pdf') {
                    div.insertAdjacentHTML('beforeend',
                        `<a href="${post.file_path}" class="comment-file-link" target="_blank" rel="noopener noreferrer">📄 PDF を開く</a>`);
                } else if (['doc', 'docx'].includes(ext)) {
                    div.insertAdjacentHTML('beforeend',
                        `<a href="${post.file_path}" class="comment-file-link" download>📝 Word をダウンロード</a>`);
                } else {
                    div.insertAdjacentHTML('beforeend',
                        `<a href="${post.file_path}" class="comment-file-link" download>📎 ファイルを保存</a>`);
                }
            }

            // Always append to the bottom (YouTube Live style: newest at the bottom)
            container.appendChild(div);
        }

        function loadPosts() {
            fetch('/api/posts')
                .then(response => response.json())
                .then(data => {
                    const postsDiv = document.getElementById('posts');
                    const currentHighestId = data.posts.length > 0 ? data.posts[0].id : 0;

                    if (isInitialLoad) {
                        postsDiv.innerHTML = '';
                        // data.posts is DESC (newest first), but we want oldest at the top
                        const reversed = [...data.posts].reverse();
                        reversed.forEach(post => {
                            renderPost(post, postsDiv);
                        });
                        isInitialLoad = false;
                        // Auto-scroll to the bottom
                        postsDiv.scrollTop = postsDiv.scrollHeight;
                    } else {
                        // Polling: Only process posts that are newer than our last known ID
                        const newPosts = data.posts.filter(post => post.id > lastHighestId);
                        // newPosts is DESC, reverse to append oldest-first
                        const reversedNew = [...newPosts].reverse();
                        reversedNew.forEach(post => {
                            renderPost(post, postsDiv);
                        });
                        // Auto-scroll to show newest comment
                        if (newPosts.length > 0) {
                            postsDiv.scrollTop = postsDiv.scrollHeight;
                        }
                    }

                    lastHighestId = Math.max(lastHighestId, currentHighestId);
                });
        }

        document.getElementById('postForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = '紡ぎ中... ✨';
            submitBtn.disabled = true;

            const nameInput = document.getElementById('name');
            if (nameInput.value) {
                localStorage.setItem('fantasy_board_name', nameInput.value);
            } else {
                localStorage.removeItem('fantasy_board_name');
            }

            const formData = new FormData(this);
            fetch('/post', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json().then(data => ({ status: response.status, body: data })))
                .then(({ status, body }) => {
                    if (status >= 400 && body.error) {
                        alert(body.error);
                    } else {
                        document.getElementById('content').value = '';
                        document.getElementById('fileInput').value = '';
                        document.getElementById('fileName').textContent = '';
                        loadPosts();
                    }
                })
                .catch(error => {
                    console.error('Error submitting post:', error);
                    alert("送信中に魔法の乱れが生じました。もう一度お試しください。");
                })
                .finally(() => {
                    submitBtn.innerText = originalText;
                    submitBtn.disabled = false;
                });
        });

        // Restore name from localStorage if available
        const savedName = localStorage.getItem('fantasy_board_name');
        if (savedName) {
            document.getElementById('name').value = savedName;
        }

        // Load posts initially and every 2 seconds
        loadPosts();
        setInterval(loadPosts, 2000);
    </script>
</body>

</html>
