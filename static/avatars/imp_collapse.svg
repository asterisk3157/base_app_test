  <rect x="35" y="75" width="130" height="50" rx="4" fill="#333" stroke="#555" stroke-width="1"/>
  <!-- Glitch slice 1 (shifted right) -->
  <rect x="40" y="78" width="120" height="12" fill="#333"/>
  <text x="47" y="88" font-family="monospace" font-size="10" fill="#0f0" opacity="0.8">ERR0R_COLL</text>
