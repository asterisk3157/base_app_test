  <path d="M88 88 Q85 78 89 68" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M100 86 Q97 74 101 64" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M112 88 Q109 78 113 68" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Japanese character hint -->
