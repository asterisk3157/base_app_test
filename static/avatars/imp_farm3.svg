<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <circle cx="100" cy="100" r="100" fill="#e3f2fd"/>
  <!-- Capsule body -->
  <rect x="65" y="72" width="70" height="56" rx="28" fill="#42a5f5"/>
  <!-- Capsule division line -->
  <line x1="100" y1="72" x2="100" y2="128" stroke="#e3f2fd" stroke-width="2"/>
  <!-- Right half slightly different color -->
  <path d="M100 72 A28 28 0 0 1 135 100 L135 100 A28 28 0 0 1 100 128 Z" fill="#1e88e5"/>
  <!-- Shine -->
  <ellipse cx="82" cy="84" rx="12" ry="5" fill="#90caf9" opacity="0.5" transform="rotate(-20 82 84)"/>
  <!-- Small dots inside (medicine particles) -->
  <circle cx="80" cy="98" r="3" fill="#bbdefb" opacity="0.6"/>
  <circle cx="88" cy="108" r="2" fill="#bbdefb" opacity="0.5"/>
  <circle cx="75" cy="112" r="2.5" fill="#bbdefb" opacity="0.5"/>
</svg>