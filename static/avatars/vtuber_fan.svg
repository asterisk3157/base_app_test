<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="vf_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </radialGradient>
    <radialGradient id="vf_light" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff80ab"/>
      <stop offset="100%" stop-color="#ff4081"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#vf_glow)"/>
  <!-- Penlight body -->
  <rect x="93" y="85" width="14" height="70" rx="5" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="1"/>
  <!-- Grip lines -->
  <line x1="95" y1="120" x2="105" y2="120" stroke="#bdbdbd" stroke-width="1"/>
  <line x1="95" y1="125" x2="105" y2="125" stroke="#bdbdbd" stroke-width="1"/>
  <line x1="95" y1="130" x2="105" y2="130" stroke="#bdbdbd" stroke-width="1"/>
  <!-- Light top -->
  <rect x="91" y="70" width="18" height="18" rx="4" fill="url(#vf_light)"/>
  <!-- Glow effect -->
  <circle cx="100" cy="79" r="25" fill="#ff80ab" opacity="0.2"/>
  <circle cx="100" cy="79" r="15" fill="#ff80ab" opacity="0.3"/>
  <!-- Light rays -->
  <line x1="100" y1="50" x2="100" y2="40" stroke="#ff80ab" stroke-width="2" opacity="0.5"/>
  <line x1="115" y1="55" x2="122" y2="48" stroke="#ff80ab" stroke-width="2" opacity="0.5"/>
  <line x1="85" y1="55" x2="78" y2="48" stroke="#ff80ab" stroke-width="2" opacity="0.5"/>
  <line x1="120" y1="68" x2="130" y2="65" stroke="#ff80ab" stroke-width="2" opacity="0.4"/>
  <line x1="80" y1="68" x2="70" y2="65" stroke="#ff80ab" stroke-width="2" opacity="0.4"/>
  <!-- Sparkles -->
  <circle cx="75" cy="55" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="128" cy="60" r="1.5" fill="#fff" opacity="0.5"/>
</svg>