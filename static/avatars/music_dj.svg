<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <circle cx="100" cy="100" r="100" fill="#1a1a2e"/>
  <!-- Headphone band -->
  <path d="M45 105 Q45 55 100 50 Q155 55 155 105" fill="none" stroke="#e0e0e0" stroke-width="6" stroke-linecap="round"/>
  <!-- Left ear pad -->
  <rect x="35" y="90" width="22" height="35" rx="8" fill="#e0e0e0"/>
  <rect x="38" y="93" width="16" height="29" rx="6" fill="#333"/>
  <!-- Right ear pad -->
  <rect x="143" y="90" width="22" height="35" rx="8" fill="#e0e0e0"/>
  <rect x="146" y="93" width="16" height="29" rx="6" fill="#333"/>
  <!-- Sound wave left -->
  <path d="M75 95 Q72 105 75 115" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.8"/>
  <path d="M68 90 Q64 105 68 120" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>
  <!-- Sound wave right -->
  <path d="M125 95 Q128 105 125 115" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.8"/>
  <path d="M132 90 Q136 105 132 120" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>
  <!-- Center equalizer bars -->
  <rect x="90" y="100" width="4" height="20" rx="2" fill="#00e5ff" opacity="0.7"/>
  <rect x="98" y="92" width="4" height="28" rx="2" fill="#00e5ff" opacity="0.9"/>
  <rect x="106" y="96" width="4" height="24" rx="2" fill="#00e5ff" opacity="0.7"/>
</svg>