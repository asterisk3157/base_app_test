<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <circle cx="100" cy="100" r="100" fill="#f5f5f5"/>
  <!-- Pokeball outer -->
  <circle cx="100" cy="100" r="55" fill="white" stroke="#333" stroke-width="4"/>
  <!-- Top half red -->
  <path d="M45 100 A55 55 0 0 1 155 100" fill="#f44336"/>
  <!-- Center line -->
  <line x1="45" y1="100" x2="155" y2="100" stroke="#333" stroke-width="4"/>
  <!-- Center button outer -->
  <circle cx="100" cy="100" r="14" fill="white" stroke="#333" stroke-width="4"/>
  <!-- Center button inner -->
  <circle cx="100" cy="100" r="7" fill="white" stroke="#333" stroke-width="2"/>
</svg>