<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="om_spot" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2a2a3e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#om_spot)"/>
  <!-- Spotlight cone -->
  <polygon points="100,15 65,170 135,170" fill="#ffd54f" opacity="0.08"/>
  <!-- Microphone head -->
  <circle cx="100" cy="72" r="18" fill="#bdbdbd" stroke="#999" stroke-width="2"/>
  <!-- Mic mesh lines -->
  <path d="M86 65 Q100 60 114 65" fill="none" stroke="#999" stroke-width="0.8"/>
  <path d="M84 72 Q100 67 116 72" fill="none" stroke="#999" stroke-width="0.8"/>
  <path d="M86 79 Q100 74 114 79" fill="none" stroke="#999" stroke-width="0.8"/>
  <!-- Mic body -->
  <rect x="95" y="88" width="10" height="50" rx="3" fill="#757575"/>
  <!-- Mic ring -->
  <rect x="93" y="88" width="14" height="5" rx="2" fill="#999"/>
  <!-- Spotlight glow at bottom -->
  <ellipse cx="100" cy="165" rx="35" ry="8" fill="#ffd54f" opacity="0.15"/>
</svg>