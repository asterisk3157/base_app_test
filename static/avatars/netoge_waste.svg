<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="nw_glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1a0a3e"/>
      <stop offset="100%" stop-color="#0a0020"/>
    </radialGradient>
    <radialGradient id="nw_crystal" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#80d8ff"/>
      <stop offset="100%" stop-color="#2979ff"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#nw_glow)"/>
  <!-- Sword blade -->
  <polygon points="100,30 108,100 100,115 92,100" fill="url(#nw_crystal)" opacity="0.9"/>
  <!-- Sword crossguard -->
  <rect x="80" y="112" width="40" height="8" rx="3" fill="#ffd54f"/>
  <!-- Sword grip -->
  <rect x="95" y="120" width="10" height="25" rx="2" fill="#6d4c41"/>
  <!-- Sword pommel -->
  <circle cx="100" cy="150" r="7" fill="#ffd54f"/>
  <!-- Glow effect -->
  <polygon points="100,30 108,100 100,115 92,100" fill="none" stroke="#80d8ff" stroke-width="2" opacity="0.5"/>
  <!-- Sparkles -->
  <circle cx="80" cy="55" r="2" fill="#80d8ff" opacity="0.8"/>
  <circle cx="125" cy="70" r="1.5" fill="#80d8ff" opacity="0.6"/>
  <circle cx="70" cy="80" r="1.5" fill="#80d8ff" opacity="0.5"/>
  <circle cx="130" cy="50" r="2" fill="#80d8ff" opacity="0.7"/>
  <!-- Light rays from blade -->
  <line x1="100" y1="40" x2="75" y2="35" stroke="#80d8ff" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="40" x2="125" y2="35" stroke="#80d8ff" stroke-width="1" opacity="0.3"/>
</svg>