  <circle cx="100" cy="100" r="40" fill="none" stroke="#282828" stroke-width="0.8"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="#2a2a2a" stroke-width="0.8"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#282828" stroke-width="0.8"/>
